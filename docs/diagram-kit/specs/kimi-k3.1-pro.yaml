# Diagram spec: Kimi K3.1 Pro
# Every value below was read from moonshotai/Kimi-K3.1-Pro at commit d9e99b0792
# (config.json, safetensors weight headers, model card) and cross-checked by ArchWatch.
# The diagram must use ONLY what is written here. If something is not here, leave it out.

model:
  name: "Kimi K3.1 Pro"
  title_label: "Kimi K3.1 Pro (2.8T)"
  lab: "Moonshot AI"
  total_params: "2.78T"
  active_params_per_token: "104B"
  layers: 93
  hidden_size: 7168
  vocabulary: "163,840 (160K)"
  context_length: "1M tokens (1,048,576)"
  modality: "text + image (vision encoder not shown in the main diagram)"

layer_pattern:
  summary: "69 KDA + 24 Gated DSA layers"
  rule: "Every 4th layer is Gated DSA (layers 4, 8, 12 ... 92), and layer 93 is also Gated DSA. All other layers are KDA."
  compressed_view:            # draw the stack as these groups, bottom to top
    - repeat: 1
      layers: ["KDA + dense FFN", "KDA + LatentMoE", "KDA + LatentMoE", "Gated DSA + LatentMoE"]
      note: "layers 1-4; only layer 1 has a dense FFN"
    - repeat: 22
      layers: ["KDA + LatentMoE", "KDA + LatentMoE", "KDA + LatentMoE", "Gated DSA + LatentMoE"]
      note: "layers 5-92"
    - repeat: 1
      layers: ["Gated DSA + LatentMoE"]
      note: "layer 93"

decoder_layer:               # one layer, bottom to top
  - "RMSNorm (pre-attention)"
  - "Token mixer: KDA or Gated DSA (see zoom panels)"
  - "Attention residual mix (learned; config attn_res_block_size = 12)"
  - "RMSNorm (pre-FFN)"
  - "FFN: dense FFN (layer 1) or LatentMoE (layers 2-93)"
  - "FFN residual mix (learned)"

residuals: >
  Residuals are not plain additions. Each layer has learned residual-mixing weights
  (self_attention_res_proj and mlp_res_proj, plus their RMSNorms), and a final
  output residual mix before the last norm. Show this as a small "AttnRes mix" node
  on each residual path. Do not invent its internal math.

zoom_panels:
  kda:
    title: "Kimi Delta Attention (KDA), 69 layers"
    heads: "96 heads x 128 dims"
    parts:                   # from the layer's weight tensors
      - "q, k, v projections: Linear 7168 -> 12288 each"
      - "short depthwise Conv1d (kernel 4) on q, k and v separately"
      - "beta: Linear 7168 -> 96 (one per head)"
      - "decay gate: low-rank Linear 7168 -> 128 -> 12288"
      - "Gated delta rule (fixed 128 x 128 state per head; cache does not grow with context)"
      - "output RMSNorm (per head, 128)"
      - "output gate: Linear 7168 -> 12288, multiplied in"
      - "output projection: Linear 12288 -> 7168"
  gated_dsa:
    title: "Gated DeepSeek Sparse Attention (DSA), 24 layers"
    parts:
      - "query path: Linear 7168 -> 1536, RMSNorm, Linear 1536 -> 96 heads x 192 (128 + 64)"
      - "KV path: Linear 7168 -> 576 = 512 latent + 64 key dims; RMSNorm on the 512 latent; Linear 512 -> 96 heads x (128 key + 128 value)"
      - "position encoding: NoPE (config mla_use_nope = true); do not label anything 'RoPE'"
      - "indexer: 32 heads x 128 dims (query from the 1536 latent, key Linear 7168 -> 128 with LayerNorm, per-head weights Linear 7168 -> 32)"
      - "indexer picks the top 2048 tokens; attention runs only on those"
      - "output gate: Linear 7168 -> 12288, multiplied in"
      - "output projection: Linear 12288 -> 7168"
    cache_per_token: "576 MLA values + 128 indexer key values per layer"
  latent_moe:
    title: "LatentMoE FFN (layers 2-93)"
    parts:
      - "router: 896 routed experts, sigmoid scores, top 16 per token"
      - "routed experts work in a smaller latent: 7168 -> 3584 (with RMSNorm) -> expert 3072 -> 3584 -> 7168"
      - "2 shared experts (combined width 6144), applied to every token in the full 7168 space"
      - "activation: SiTU-GLU (gated)"
  dense_ffn:
    title: "Dense FFN (layer 1 only)"
    parts: ["gated FFN 7168 -> 33792 -> 7168"]

io:
  bottom: ["Tokenized text", "Token embedding 163,840 x 7168"]
  top: ["Final AttnRes mix", "Final RMSNorm", "LM head 7168 -> 163,840 (not tied to the embedding)"]
  vision: "27-layer vision encoder (401M) + projector (46M) feeds image tokens into the embedding sequence; show as a small side note only"

callouts:                    # short labels with a dotted leader line
  - "Context length: 1M tokens"
  - "69 KDA + 24 Gated DSA"
  - "Layer 1 dense FFN; layers 2-93 LatentMoE"
  - "896 experts, 16 active + 2 shared"
  - "KV cache: about 33 KB per token (vs 5.7 MB for plain multi-head attention)"

do_not_include:
  - "any benchmark scores"
  - "any number not in this file"
  - "the word RoPE"
  - "logos or watermarks"
