name: reference-audit
on:
  # Manual only. Audits the deterministic pipeline against an external reference sheet named at run time.
  # No LLM calls. Nothing is committed: the reference is downloaded into cache/ and the report is uploaded as a
  # workflow artifact.
  workflow_dispatch:
    inputs:
      repo:
        description: Reference repository (owner/name)
        required: true
      path:
        description: YAML file in that repository
        required: true
      commit:
        description: Commit to read (empty = latest commit touching the file)
        required: false
permissions:
  contents: read
concurrency:
  group: reference-audit
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
      - run: uv sync --locked --python 3.12
      - name: Run the deterministic audit (no LLM calls)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REFERENCE_REPO: ${{ inputs.repo }}
          REFERENCE_PATH: ${{ inputs.path }}
          REFERENCE_COMMIT: ${{ inputs.commit }}
        run: uv run --frozen python tools/reference_audit.py --analyze
      - name: Confirm no Gemini call was made and nothing tracked changed
        run: git diff --quiet
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-audit
          path: cache/reference/audit.*
          retention-days: 7
