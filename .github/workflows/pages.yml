name: pages
# Publishes site/ from main to GitHub Pages. No LLM calls, no rebuild: it serves the pages committed on main.
# Runs after each daily run, whenever main's site/ changes (a merged daily update), and by hand.
# Off until the owner enables Pages (Settings > Pages > Source: GitHub Actions) and sets the repository
# variable PAGES_ENABLED to "true".
on:
  workflow_run:
    workflows: [daily]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
