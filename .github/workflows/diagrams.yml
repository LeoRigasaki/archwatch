name: diagrams
on:
  # Diagram/explainer job: Monday, Wednesday, Friday. Max 5 models and 15 Gemini calls per run,
  # inside the daily limit in config/providers.yaml. Models that fail wait for the next slot.
  # Approved by the owner on 2026-11-15 after a successful manual run.
  schedule:
    - cron: "37 3 * * 1,3,5"   # 08:37 Asia/Karachi, Mon/Wed/Fri
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: diagrams
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
      - run: uv sync --locked --python 3.12
      - name: Plan (no calls)
        run: uv run --frozen python tools/diagram_queue.py --plan
      - name: Generate diagrams for changed architectures
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run --frozen python tools/diagram_queue.py
      # Paid-for calls are kept no matter what happens next: the outputs and the call ledger are uploaded
      # and committed to a needs-review PR BEFORE the test suite runs. A failing test marks the run red but
      # never discards diagrams or leaves the ledger out of sync.
      - name: Keep the outputs and the call ledger
        if: always() && steps.generate.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagram-run-${{ github.run_id }}
          path: |
            data/gemini-requests.json
            data/diagram-queue.json
            data/generated-diagrams/
            diagrams/generated/
          if-no-files-found: warn
          retention-days: 30
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        if: always() && steps.generate.outcome != 'skipped'
        with:
          branch: diagram-update
          title: "ArchWatch diagram run"
          labels: needs-review
          body: |
            Generated diagrams, code-check reviews, the queue state and the call ledger from run ${{ github.run_id }}.
            Committed before the test suite runs, so the calls are never lost; check this PR's CI and review the
            previews before merging.
      # The explainer step joins this job once the explainer is approved and built.
      - name: Test suite (after the outputs are safe)
        if: always() && steps.generate.outcome != 'skipped'
        run: uv run --frozen pytest -q
