name: diagrams
on:
  # Diagram/explainer job: Monday, Wednesday, Friday. Max 5 models and 15 Gemini calls per run,
  # inside the daily limit in config/providers.yaml. Models that fail wait for the next slot.
  # Keep cron disabled until the owner explicitly approves it.
  # schedule:
  #   - cron: "37 3 * * 1,3,5"   # 08:37 Asia/Karachi, Mon/Wed/Fri
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: diagrams
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
      - run: uv sync --locked --python 3.12
      - name: Plan (no calls)
        run: uv run --frozen python tools/diagram_queue.py --plan
      - name: Generate diagrams for changed architectures
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run --frozen python tools/diagram_queue.py
      # The explainer step joins this job once the explainer is approved and built.
      - run: uv run --frozen pytest -q
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: diagram-update
          title: "ArchWatch diagram run"
          labels: needs-review
          body: Generated diagrams, code-check reviews and the queue state. Review the previews before merging.
