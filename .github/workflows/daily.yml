name: daily
on:
  # Keep cron disabled until the user explicitly approves it after manual acceptance.
  # Weekly Gemini generation will use a separate bounded queue; it is not wired here.
  # schedule:
  #   - cron: "17 2 * * *"   # 07:17 Asia/Karachi
  workflow_dispatch:
    inputs:
      mode:
        description: Fixed-list smoke test, discovery only, or bounded watcher analysis
        type: choice
        options: [fixed, discover, process]
        default: fixed
permissions:
  contents: write
  pull-requests: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR action configures Git authentication itself. Avoid duplicate
          # Authorization headers from checkout's included credential file.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
      - run: uv sync --locked --python 3.12
      - name: Analyze watched models
        if: inputs.mode == 'fixed' || inputs.mode == ''
        run: uv run --frozen python run.py $(cat watchlist.txt)
      - name: Discover or process Hub candidates
        if: inputs.mode == 'discover' || inputs.mode == 'process'
        env:
          ARCHWATCH_MODE: ${{ inputs.mode }}
        run: |
          if [ "$ARCHWATCH_MODE" = "process" ]; then
            uv run --frozen python watch.py --process --report "$RUNNER_TEMP/archwatch-report.json"
          else
            uv run --frozen python watch.py --report "$RUNNER_TEMP/archwatch-report.json"
          fi
      - run: uv run --frozen python build_site.py
      - run: uv run --frozen pytest -q
      - name: Count conflicts
        id: conflicts
        run: |
          n=$(uv run --frozen python - <<'PY'
          import json
          from pathlib import Path
          count = sum(len(json.loads(p.read_text())["review_queue"]) for p in Path("data/models").glob("*.json"))
          seen = Path("data/seen.json")
          if seen.exists():
              state = json.loads(seen.read_text())
              count += len(state.get("discovery_errors", []))
              count += sum(e["status"] in ("review", "error") for e in state["models"].values())
          print(count)
          PY
          )
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        id: updates
        with:
          branch: daily-update
          title: "ArchWatch daily update (${{ steps.conflicts.outputs.n }} items in review)"
          labels: ${{ steps.conflicts.outputs.n != '0' && 'needs-review' || 'auto-merge' }}
          body: Records rebuilt from the Hub. Fields in review are listed in each model's YAML.
      - name: Optional Discord watcher summary
        if: always() && (inputs.mode == 'discover' || inputs.mode == 'process')
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ARCHWATCH_PR_URL: ${{ steps.updates.outputs.pull-request-url }}
        run: uv run --frozen python tools/notify_discord.py --report "$RUNNER_TEMP/archwatch-report.json"
