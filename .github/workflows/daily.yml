name: daily
on:
  # Enable discovery only after the watcher has passed a manual run.
  # Weekly Gemini generation will use a separate bounded queue; it is not wired here.
  # schedule:
  #   - cron: "17 2 * * *"   # 07:17 Asia/Karachi
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
      - run: uv sync --locked --python 3.12
      - name: Analyze watched models
        run: uv run --frozen python run.py $(cat watchlist.txt)
      - run: uv run --frozen python build_site.py
      - run: uv run --frozen pytest -q
      - name: Count conflicts
        id: conflicts
        run: |
          n=$(uv run --frozen python -c "import json,glob;print(sum(len(json.load(open(f))['review_queue']) for f in glob.glob('data/models/*.json')))")
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: daily-update
          title: "ArchWatch daily update (${{ steps.conflicts.outputs.n }} fields in review)"
          labels: ${{ steps.conflicts.outputs.n != '0' && 'needs-review' || 'auto-merge' }}
          body: Records rebuilt from the Hub. Fields in review are listed in each model's YAML.
