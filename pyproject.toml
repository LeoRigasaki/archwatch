[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archwatch"
version = "0.1.0"
description = "Evidence-backed architecture extraction and comparison for open-weight language models"
requires-python = ">=3.12"
dependencies = ["huggingface_hub>=0.26", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
