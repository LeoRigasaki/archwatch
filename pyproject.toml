[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archwatch"
version = "0.1.0"
description = "Evidence-backed architecture extraction and comparison for open-weight language models"
requires-python = ">=3.12"
dependencies = ["huggingface_hub>=0.26", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "pre-commit>=4",
    "playwright>=1.65.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
# Upstream modelling code kept byte-for-byte as test fixtures; not ArchWatch code.
extend-exclude = ["tests/fixtures/real"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
