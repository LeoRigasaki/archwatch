<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1210">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#333333"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #1F2937; }
      .title { font-size: 34px; font-weight: 700; text-anchor: middle; }
      .summary { font-size: 16px; fill: #4B5563; text-anchor: middle; }
      .panel-title { font-size: 18px; font-weight: 700; }
      .box-label { font-size: 14px; text-anchor: middle; dominant-baseline: central; }
      .bar-label { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .repeat-label { font-size: 16px; font-weight: 700; fill: #374151; dominant-baseline: central; }
      .caption { font-size: 14px; fill: #6B7280; }
      .callout { font-size: 15px; font-weight: 700; fill: #1F2937; }
      .edge { fill: none; stroke: #333333; stroke-width: 1.6; }
      .node-box { fill: #FFFFFF; stroke: #4B5563; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1480" height="1210" fill="#FFFFFF"/>

  <g data-section="title">
    <text x="740" y="62" class="title">Mage-VL (5.3B)</text>
    <text x="740" y="94" class="summary">5.28B parameters, 36 layers, 256K context</text>
  </g>

  <g data-section="stack">
    <rect x="24" y="130" width="756" height="462" rx="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>

    <line x1="224" y1="176" x2="224" y2="144" class="edge" marker-end="url(#arrow)"/>

    <g data-io="lm_head">
      <rect x="48" y="176" width="352" height="44" rx="8" class="node-box"/>
      <text x="224" y="198" class="box-label">LM head 2560 -&gt; 151,936</text>
    </g>

    <text x="418" y="194" class="caption">LM head is not tied
      <tspan x="418" dy="18">to the embedding</tspan>
    </text>

    <line x1="224" y1="248" x2="224" y2="220" class="edge" marker-end="url(#arrow)"/>

    <g data-io="final_norm">
      <rect x="48" y="248" width="352" height="44" rx="8" class="node-box"/>
      <text x="224" y="270" class="box-label">Final norm</text>
    </g>

    <line x1="224" y1="324" x2="224" y2="292" class="edge" marker-end="url(#arrow)"/>

    <g data-group="1" data-repeat="36">
      <rect x="36" y="324" width="376" height="92" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
      <rect data-layer="GQA + FFN" x="48" y="353" width="352" height="34" rx="5" fill="#F4A8A4" stroke="#B84742" stroke-width="1.2"/>
      <text x="224" y="370" class="bar-label">GQA + FFN</text>
      <text x="424" y="370" class="repeat-label">36 x</text>
    </g>

    <line x1="224" y1="448" x2="224" y2="416" class="edge" marker-end="url(#arrow)"/>

    <g data-io="embedding">
      <rect x="48" y="448" width="352" height="52" rx="8" class="node-box"/>
      <text x="224" y="474" class="box-label">Token embedding 151,936 x 2560</text>
    </g>

    <line x1="224" y1="528" x2="224" y2="500" class="edge" marker-end="url(#arrow)"/>

    <g data-io="text">
      <rect x="48" y="528" width="352" height="44" rx="8" class="node-box"/>
      <text x="224" y="550" class="box-label">Tokenized text</text>
    </g>

    <g data-callout="1">
      <text x="564" y="328" class="callout">Context length: 256K
        <tspan x="564" dy="18">tokens</tspan>
      </text>
    </g>
    <g data-callout="2">
      <text x="564" y="368" class="callout">32 Q / 8 KV heads</text>
    </g>
    <g data-callout="5">
      <text x="564" y="392" class="callout">KV cache: 144 KB
        <tspan x="564" dy="18">per token</tspan>
      </text>
    </g>
    <g data-callout="3">
      <text x="564" y="460" class="callout">Vocabulary: 151,936</text>
    </g>
    <g data-callout="4">
      <text x="564" y="484" class="callout">Embedding dimension:
        <tspan x="564" dy="18">2560</tspan>
      </text>
    </g>
  </g>

  <g data-section="each-layer">
    <rect x="24" y="616" width="756" height="568" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="44" y="650" class="panel-title">Each layer</text>

    <g data-node="out">
      <rect x="440" y="676" width="160" height="36" rx="8" class="node-box"/>
      <text x="520" y="694" class="box-label">layer output</text>
    </g>
    <g data-node="res2">
      <rect x="440" y="740" width="160" height="36" rx="8" class="node-box"/>
      <text x="520" y="758" class="box-label">residual add</text>
    </g>
    <g data-node="ffn">
      <rect x="180" y="804" width="120" height="36" rx="8" class="node-box"/>
      <text x="240" y="822" class="box-label">FFN</text>
    </g>
    <g data-node="pre_ffn_norm">
      <rect x="155" y="868" width="170" height="36" rx="8" class="node-box"/>
      <text x="240" y="886" class="box-label">norm (pre-FFN)</text>
    </g>
    <g data-node="res1">
      <rect x="440" y="932" width="160" height="36" rx="8" class="node-box"/>
      <text x="520" y="950" class="box-label">residual add</text>
    </g>
    <g data-node="mixer">
      <rect x="150" y="996" width="180" height="36" rx="8" class="node-box"/>
      <text x="240" y="1014" class="box-label">token mixer: GQA</text>
    </g>
    <g data-node="pre_mixer_norm">
      <rect x="150" y="1060" width="180" height="36" rx="8" class="node-box"/>
      <text x="240" y="1078" class="box-label">norm (pre-mixer)</text>
    </g>
    <g data-node="in">
      <rect x="440" y="1124" width="160" height="36" rx="8" class="node-box"/>
      <text x="520" y="1142" class="box-label">layer input</text>
    </g>

    <polyline data-edge="in-&gt;pre_mixer_norm" points="440,1142 240,1142 240,1096" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="pre_mixer_norm-&gt;mixer" x1="240" y1="1060" x2="240" y2="1032" class="edge" marker-end="url(#arrow)"/>
    <polyline data-edge="mixer-&gt;res1" points="240,996 240,950 440,950" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="in-&gt;res1" x1="520" y1="1124" x2="520" y2="968" class="edge" marker-end="url(#arrow)"/>
    <polyline data-edge="res1-&gt;pre_ffn_norm" points="480,932 480,918 240,918 240,904" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="pre_ffn_norm-&gt;ffn" x1="240" y1="868" x2="240" y2="840" class="edge" marker-end="url(#arrow)"/>
    <polyline data-edge="ffn-&gt;res2" points="240,804 240,758 440,758" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="res1-&gt;res2" x1="540" y1="932" x2="540" y2="776" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="res2-&gt;out" x1="520" y1="740" x2="520" y2="712" class="edge" marker-end="url(#arrow)"/>
  </g>

  <g data-section="zooms">
    <g data-zoom="gqa">
      <rect x="810" y="130" width="640" height="558" rx="10" fill="#FFFFFF" stroke="#B84742" stroke-width="2" stroke-dasharray="6,5"/>
      <text x="830" y="160" class="panel-title" style="fill: #B84742;">GQA attention (36 layers)</text>

      <g data-node="out">
        <rect x="1055" y="182" width="150" height="36" rx="8" class="node-box"/>
        <text x="1130" y="200" class="box-label">output (2560)</text>
      </g>
      <g data-node="oproj">
        <rect x="990" y="248" width="280" height="36" rx="8" class="node-box"/>
        <text x="1130" y="266" class="box-label">output projection: 4096 -&gt; 2560</text>
      </g>
      <g data-node="attn">
        <rect x="1000" y="314" width="260" height="36" rx="8" class="node-box"/>
        <text x="1130" y="332" class="box-label">attention: 32 q / 8 kv heads</text>
      </g>
      <g data-node="rotary">
        <rect x="938" y="380" width="176" height="36" rx="8" class="node-box"/>
        <text x="1026" y="398" class="box-label">rotary on q and k</text>
      </g>
      <g data-node="qnorm">
        <rect x="857" y="446" width="130" height="36" rx="8" class="node-box"/>
        <text x="922" y="464" class="box-label">q norm (128)</text>
      </g>
      <g data-node="knorm">
        <rect x="1065" y="446" width="130" height="36" rx="8" class="node-box"/>
        <text x="1130" y="464" class="box-label">k norm (128)</text>
      </g>
      <g data-node="q">
        <rect x="830" y="512" width="184" height="36" rx="8" class="node-box"/>
        <text x="922" y="530" class="box-label">q: Linear 2560 -&gt; 4096</text>
      </g>
      <g data-node="k">
        <rect x="1038" y="512" width="184" height="36" rx="8" class="node-box"/>
        <text x="1130" y="530" class="box-label">k: Linear 2560 -&gt; 1024</text>
      </g>
      <g data-node="v">
        <rect x="1246" y="512" width="184" height="36" rx="8" class="node-box"/>
        <text x="1338" y="530" class="box-label">v: Linear 2560 -&gt; 1024</text>
      </g>
      <g data-node="in">
        <rect x="1055" y="578" width="150" height="36" rx="8" class="node-box"/>
        <text x="1130" y="596" class="box-label">input (2560)</text>
      </g>

      <polyline data-edge="in-&gt;q" points="1090,578 1090,563 922,563 922,548" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="in-&gt;k" x1="1130" y1="578" x2="1130" y2="548" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="in-&gt;v" points="1170,578 1170,563 1338,563 1338,548" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="q-&gt;qnorm" x1="922" y1="512" x2="922" y2="482" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="k-&gt;knorm" x1="1130" y1="512" x2="1130" y2="482" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="qnorm-&gt;rotary" points="922,446 922,431 982,431 982,416" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="knorm-&gt;rotary" points="1130,446 1130,431 1070,431 1070,416" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="rotary-&gt;attn" x1="1040" y1="380" x2="1040" y2="350" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="v-&gt;attn" points="1338,512 1338,365 1220,365 1220,350" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="attn-&gt;oproj" x1="1130" y1="314" x2="1130" y2="284" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="oproj-&gt;out" x1="1130" y1="248" x2="1130" y2="218" class="edge" marker-end="url(#arrow)"/>

      <text x="830" y="646" class="caption">32 query heads, 8 key/value heads, head size 128
        <tspan x="830" dy="20">rotary position encoding, theta 5,000,000</tspan>
      </text>
    </g>

    <g data-zoom="ffn">
      <rect x="810" y="712" width="640" height="442" rx="10" fill="#FFFFFF" stroke="#5A6270" stroke-width="2" stroke-dasharray="6,5"/>
      <text x="830" y="742" class="panel-title" style="fill: #5A6270;">SwiGLU FFN</text>

      <g data-node="out">
        <rect x="1055" y="764" width="150" height="36" rx="8" class="node-box"/>
        <text x="1130" y="782" class="box-label">output (2560)</text>
      </g>
      <g data-node="down">
        <rect x="1020" y="830" width="220" height="36" rx="8" class="node-box"/>
        <text x="1130" y="848" class="box-label">down: Linear 9728 -&gt; 2560</text>
      </g>
      <g data-node="mul">
        <rect x="1075" y="896" width="110" height="36" rx="8" class="node-box"/>
        <text x="1130" y="914" class="box-label">multiply</text>
      </g>
      <g data-node="act">
        <rect x="940" y="962" width="100" height="36" rx="8" class="node-box"/>
        <text x="990" y="980" class="box-label">SiLU</text>
      </g>
      <g data-node="gate">
        <rect x="880" y="1028" width="220" height="36" rx="8" class="node-box"/>
        <text x="990" y="1046" class="box-label">gate: Linear 2560 -&gt; 9728</text>
      </g>
      <g data-node="up">
        <rect x="1165" y="1028" width="210" height="36" rx="8" class="node-box"/>
        <text x="1270" y="1046" class="box-label">up: Linear 2560 -&gt; 9728</text>
      </g>
      <g data-node="in">
        <rect x="1055" y="1094" width="150" height="36" rx="8" class="node-box"/>
        <text x="1130" y="1112" class="box-label">input (2560)</text>
      </g>

      <polyline data-edge="in-&gt;gate" points="1095,1094 1095,1079 990,1079 990,1064" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="in-&gt;up" points="1165,1094 1165,1079 1270,1079 1270,1064" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="gate-&gt;act" x1="990" y1="1028" x2="990" y2="998" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="act-&gt;mul" points="990,962 990,947 1105,947 1105,932" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="up-&gt;mul" points="1270,1028 1270,947 1155,947 1155,932" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="mul-&gt;down" x1="1130" y1="896" x2="1130" y2="866" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="down-&gt;out" x1="1130" y1="830" x2="1130" y2="800" class="edge" marker-end="url(#arrow)"/>
    </g>
  </g>
</svg>