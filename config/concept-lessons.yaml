# Original educational examples; toy values are separate from model records.
mha:
  why: One token may need several kinds of context at once. Separate learned projections let attention combine information
    through several parallel channels. The head count is a design choice; the heads are not hand-assigned grammar
    or reasoning roles.
  equation: 'Q = XWq; K = XWk; V = XWv

    A = softmax(QKᵀ / √d + causal_mask)

    Head output = AV

    MHA output = concatenate(head outputs) Wo'
  symbols:
    X: Token representations.
    d: Key width of one head.
    A: Attention weights over the visible positions.
    causal_mask: Excludes future positions during causal decoding.
  example:
    setup: Take one query q=(1,0), two visible keys k₁=(1,0), k₂=(0,1), and values v₁=(2,0), v₂=(0,4). This is one
      head with width 2.
    steps:
    - The two dot products are 1 and 0. Divide them by √2 to get approximately 0.707 and 0.
    - Softmax produces weights approximately 0.670 and 0.330. Both visible values can contribute; attention does
      not have to pick a single token.
    - The weighted value sum is about (1.340, 1.321). A multi-head layer repeats the calculation with other learned
      projections, concatenates the results, and projects them back.
    result: Attention weights mix value vectors. They are different from the model parameters in Wq, Wk and Wv.
  pitfalls:
  - A head is not a separate language model. Its output is combined with the other heads.
  - A causal mask constrains visibility. It is not the same operation as changing positional encoding.
  - 'The token-by-token attention matrix is not the persistent KV cache: optimized kernels need not materialize
    that entire matrix.'
  takeaway: Inspect head organization, position handling and retained state separately. They answer different architecture
    questions.
  diagram:
  - Token representations
  - Four parallel attention heads
  - Concatenate outputs
  - Output projection
  related:
  - gqa
  - kv-cache
  - rope
  code: 'from math import exp, sqrt

    q = (1, 0)

    keys = [(1, 0), (0, 1)]

    values = [(2, 0), (0, 4)]

    logits = [sum(a*b for a,b in zip(q,k)) / sqrt(2) for k in keys]

    weights = [exp(x) / sum(exp(y) for y in logits) for x in logits]

    output = [sum(w*v[j] for w,v in zip(weights,values)) for j in range(2)]

    print(weights, output)'
gqa:
  why: During decoding, reading past keys and values can be expensive. Query heads can retain separate queries while
    sharing fewer key/value projections. Sharing changes head organization without changing the number of decoder
    layers.
  equation: 'KV bytes = 2 × L × T × Hkv × d × b

    Sharing group size = Hq / Hkv

    Equal-geometry cache ratio to MHA = Hkv / Hq'
  symbols:
    L: Attention layers in this toy calculation.
    T: Retained tokens per sequence.
    Hq / Hkv: Query heads / key-value heads.
    d / b: Values per key or value head / bytes per value.
    '2': One key and one value.
  example:
    setup: Use 2 layers, 4,096 retained tokens, 8 query heads, head width 64 and bf16 storage (2 bytes per value).
      Compare 8, 2 and 1 KV heads.
    steps:
    - With 8 KV heads, the cache is 2 × 2 × 4,096 × 8 × 64 × 2 = 16,777,216 bytes, or 16 MiB.
    - With 2 KV heads, the same calculation gives 4 MiB. Each KV head is shared by 4 query heads.
    - 'With 1 KV head, it gives 2 MiB: the MQA endpoint. The reduction comes from the retained KV representation,
      not from quantizing the weights.'
    result: The GQA example retains one quarter of the MHA cache under these equal-width assumptions. This is an
      arithmetic example, not a quality or latency benchmark.
  pitfalls:
  - Use the actual KV-head count, not the query-head count, in this cache formula.
  - MLA stores a different representation; substituting its head counts into the GQA formula can be wrong.
  - If key and value widths differ, replace the leading factor-of-two shortcut with their separate widths.
  takeaway: GQA is especially useful to recognize when comparing long-context memory for otherwise similar dense
    decoders.
  diagram:
  - Eight query heads
  - Two shared KV groups
  - Attend separately
  - Combine head outputs
  related:
  - mha
  - mla
  - kv-cache
  code: 'layers, tokens, kv_heads, head_width, value_bytes = 2, 4096, 2, 64, 2

    cache_bytes = 2 * layers * tokens * kv_heads * head_width * value_bytes

    print(cache_bytes / 2**20, "MiB")  # 4.0 MiB'
kv-cache:
  why: Autoregressive decoding repeatedly needs information from earlier positions. Retaining the appropriate state
    avoids recomputing the whole prefix for every new token. The representation depends on the operator in each
    layer.
  equation: 'Persistent state = growing state + windowed state + recurrent state

    Toy full-attention cache = 2 × L × T × Hkv × d × b

    Planning total = shared weight storage + sequences × persistent state'
  symbols:
    L, T: Layers and retained context tokens.
    Hkv, d: KV heads and head width.
    b: Cache bytes per value, independently of weight precision.
  example:
    setup: Suppose weights require 4 GiB and persistent state is 1 GiB per independent sequence.
    steps:
    - One sequence has a theoretical weights-plus-state total of 5 GiB.
    - Four sequences sharing one model copy require 4 + 4 × 1 = 8 GiB under this simple accounting.
    - Actual allocation can add activations, quantization metadata, workspaces and fragmentation. Prefix sharing
      or offloading can change the runtime result.
    result: Weights are counted once in this example; sequence-specific state is counted four times.
  pitfalls:
  - Four-bit weights do not imply four-bit attention cache.
  - Allocated cache capacity may exceed the mathematical retained-state minimum.
  - Batch size and context length are independent inputs.
  takeaway: Use the planner to reason about components, then validate the chosen runtime on the target device.
  diagram:
  - Shared model weights
  - State for sequence A
  - State for sequence B
  - Runtime allocations
  related:
  - gqa
  - sliding-window
  - linear-attention
sliding-window:
  why: A local attention layer limits direct token visibility to a recent neighborhood. This bounds its retained
    history, while global layers elsewhere in the model may continue to grow with context.
  equation: 'Local retained tokens = min(T, W)

    Local KV bytes = 2 × Llocal × min(T,W) × Hkv × d × b

    Hybrid cache = local cache + global cache + other persistent state'
  symbols:
    W: Retained window under the stated implementation convention.
    T: Processed context length.
    Llocal: Number of local-attention layers.
  example:
    setup: Compare an 8,192-token context with a 1,024-token window in one local layer. Use 2 KV heads, width 64
      and bf16.
    steps:
    - Full retention would cost 2 × 8,192 × 2 × 64 × 2 = 4 MiB for that layer.
    - Retaining 1,024 tokens costs 0.5 MiB. Extending the sequence further leaves this local term capped.
    - A separate global layer with the same geometry still needs 4 MiB at this context. Add both terms rather than
      capping the whole model.
    result: For the two-layer local/global example, persistent attention cache is 4.5 MiB, not 1 MiB.
  pitfalls:
  - A sliding_window value does not establish which layers use it.
  - Some runtimes allocate a larger static cache; the retained minimum and allocation are different.
  - Confirm whether the implementation counts the current position inside its stated window.
  takeaway: The per-layer local/global schedule matters as much as the window size.
  diagram:
  - Earlier positions
  - Recent visible window
  - Current query
  related:
  - gqa
  - kv-cache
  - attention-budgeting
mla:
  why: Head sharing and latent compression solve related memory problems in different ways. MLA retains a compressed
    representation that can be expanded or absorbed into attention projections according to the implementation.
  equation: 'Toy MLA cache per token = (latent_width + positional_width) × bytes_per_value

    Model growing cache = tokens × Σ(per-layer retained width × precision)'
  symbols:
    latent_width: Retained compressed KV representation, not the full expanded per-head projections.
    positional_width: Any separately retained positional component.
  example:
    setup: Imagine a layer retaining a latent vector of width 8 plus a positional component of width 2, both bf16.
    steps:
    - The retained state is (8 + 2) × 2 = 20 bytes per token.
    - For 100 tokens, that is 2,000 bytes for this layer before any additional indexer or runtime storage.
    - The expanded query/value head geometry may be much larger. Counting those expanded projections as the cache
      would describe a different implementation.
    result: Cache accounting follows the stored representation. An extra sparse-attention indexer must be counted
      separately when present.
  pitfalls:
  - The name MLA does not prove which compressed tensors the runtime retains.
  - A model-specific NoPE flag can remove a positional component from one path; confirm the actual update code.
  - Low query/KV head counts alone do not identify MLA.
  takeaway: Inspect compression rank, positional components and cache-update code together.
  diagram:
  - Hidden representation
  - Compressed KV latent
  - Attention computation
  - Output representation
  related:
  - gqa
  - dsa
  - nope
  - kv-cache
moe:
  why: A sparse expert layer offers multiple feed-forward networks and chooses a subset for each token. The expert
    selection is token-dependent; different tokens can follow different routes in the same layer.
  equation: 'Expert output = Σ(selected expert weight × expert output)

    Toy stored parameters = shared parameters + N × expert parameters

    Toy active parameters = shared parameters + k × expert parameters'
  symbols:
    N / k: Total routed experts / selected routed experts.
    shared parameters: Always-used parameters in this simplified example; real conventions differ.
  example:
    setup: Consider 8 experts with 100 parameters each, 20 always-used parameters, and 2 selected experts per token.
      Ignore router parameters in this toy count.
    steps:
    - The stored total is 20 + 8 × 100 = 820 parameters.
    - The active total for one token is 20 + 2 × 100 = 220 parameters.
    - All 820 parameters still need storage or an explicit offloading/distribution strategy. Selecting two experts
      does not turn the stored model into a 220-parameter file.
    result: Sparse activation changes per-token work. It does not automatically reduce full weight storage to the
      active count.
  pitfalls:
  - Shared experts are additional always-used paths, not extra routed selections.
  - Expert routing scores and FFN activation functions are different operations.
  - Active-parameter conventions can include or exclude embeddings and prediction modules; compare like for like.
  takeaway: Always read stored and active parameter counts together with the counting convention.
  diagram:
  - Token representation
  - Router selects two experts
  - Selected expert outputs
  - Weighted combination
  related:
  - latent-moe
  - silu
  - mtp
linear-attention:
  why: Recurrent attention mechanisms summarize prior processing in a structured state. The update rule determines
    what information is retained and how a token reads from that state.
  equation: 'State update: Sₜ = update(Sₜ₋₁, tokenₜ)

    Output: yₜ = read(Sₜ, tokenₜ)

    Toy matrix-state storage = heads × key_width × value_width × state_bytes'
  symbols:
    S: Persistent recurrent state.
    update / read: Family-specific functions, not interchangeable algorithms.
  example:
    setup: Take 2 heads with a 4 × 4 state matrix per head, stored in fp32.
    steps:
    - The matrices require 2 × 4 × 4 × 4 = 128 bytes.
    - That matrix-state term remains 128 bytes as the token count grows. Convolution buffers or other update state
      may add storage.
    - If the decoder also includes full-attention layers, their growing cache must be added; the whole hybrid model
      is not constant-memory.
    result: Fixed-size recurrent state and growing token cache can coexist in the same architecture.
  pitfalls:
  - A linear_attention config string does not identify the exact recurrent update.
  - KDA and Gated DeltaNet are distinct named designs.
  - The state can use fp32 even when weights and attention cache use lower precision.
  takeaway: Qualify the actual state dimensions, precision and update before choosing a formula.
  diagram:
  - Previous recurrent state
  - Token-dependent update
  - Next state
  - Read output
  related:
  - hybrid-attention
  - short-convolution
  - mamba2
sparse-attention:
  why: Sparse attention reduces the set of positions participating in a particular attention operation. Selection
    can be fixed, window-based, learned or indexed; these choices have different semantics.
  equation: 'Attention output = attention(query, selected keys, selected values)

    Selected positions ⊆ retained positions'
  symbols:
    selected: Positions used for this attention computation.
    retained: Positions stored so that future queries can select them.
  example:
    setup: Imagine 8 retained positions. A selector chooses positions 1, 4 and 7 for the current query.
    steps:
    - The main attention operation uses three positions in this illustrative step.
    - All eight may still need to remain in the cache for later queries.
    - A learned selector can maintain additional keys or scores. That auxiliary storage is separate from the main
      attention representation.
    result: A selection budget is a compute-path property; it does not, by itself, define the retained cache length.
  pitfalls:
  - A small top-k does not imply that only top-k positions are cached.
  - Local windows and learned global selection are different sparsity patterns.
  - Do not label every sparse method DSA or QSA.
  takeaway: Inspect selection, main attention and retained state as three separate pieces.
  diagram:
  - Retained positions
  - Select a subset
  - Attention over selected positions
  related:
  - dsa
  - qwen-sparse-attention
  - sliding-window
mamba2:
  why: A state-space mixer evolves a structured recurrent state rather than computing a token-to-token softmax attention
    matrix. Hybrid decoders can interleave such mixers with attention and standalone MLP blocks.
  equation: 'Toy SSM state bytes = heads × head_width × state_size × state_bytes

    Persistent mixer state = SSM state + convolution buffers'
  symbols:
    state_size: State-space dimension in this toy factorization.
    state_bytes: Precision used for the recurrent state, not necessarily weight precision.
  example:
    setup: Use 2 heads, head width 4 and state size 8 with fp32 state.
    steps:
    - The recurrent state term is 2 × 4 × 8 × 4 = 256 bytes.
    - Add the convolution buffer under its actual channel, kernel and precision rules.
    - In a hybrid decoder, separately add the cache of any attention layers. A standalone MLP block does not receive
      an attention KV-cache term.
    result: Persistent state accounting must follow each operator in the layer schedule.
  pitfalls:
  - A parallel attention/SSM block is not the same graph as standalone blocks.
  - State precision can differ from convolution precision.
  - Architecture labels alone do not establish a runtime memory measurement.
  takeaway: Use implementation-qualified state formulas and preserve the block layout.
  diagram:
  - Token and previous state
  - State-space update
  - Output and next state
  related:
  - linear-attention
  - hybrid-attention
  - kv-cache
short-convolution:
  why: A short convolution mixes a bounded recent history. It may be the decoder mixer itself or a nested operation
    inside another mixer; that placement changes the graph and layer count.
  equation: 'Chronological toy kernel:

    yₜ = w₀xₜ₋₂ + w₁xₜ₋₁ + w₂xₜ

    History-only buffer = channels × (kernel−1) × bytes_per_value'
  symbols:
    kernel: Number of input positions used by one convolution output.
    history-only: The current token is supplied separately; some implementations retain a full kernel buffer.
  example:
    setup: Use a three-position kernel over one scalar sequence. For the last inputs (2,3,4), choose weights (1,0,−1).
    steps:
    - The output is 1 × 2 + 0 × 3 − 1 × 4 = −2.
    - Only two preceding positions are needed if the current input is provided separately.
    - For 4 channels and bf16 values, the history-only buffer is 4 × 2 × 2 = 16 bytes. A full three-position buffer
      would use 24 bytes.
    result: Buffer convention must come from the implementation. Neither convention creates extra decoder layers.
  pitfalls:
  - Nested convolutions inside KDA must not be added to the decoder layer sum.
  - Channel width need not equal model hidden width.
  - A kernel size does not establish gating, padding or dilation.
  takeaway: 'Retain both the operation and its scope: standalone mixer or nested sublayer.'
  diagram:
  - Recent token history
  - Short convolution
  - Updated buffer and output
  related:
  - linear-attention
  - hybrid-attention
  - kv-cache
rmsnorm:
  why: Hidden-vector magnitude can change through depth. RMS normalization controls that magnitude without subtracting
    the vector mean. The normalization equation and where it is placed are separate design choices.
  equation: 'RMS(x) = √(mean(x²) + ε)

    yᵢ = γᵢ × xᵢ / RMS(x)'
  symbols:
    ε: Small numerical stabilizer.
    γ: Learned element-wise scale.
    mean(x²): Mean of squared components, not centered variance.
  example:
    setup: Let x=(3,4), set learned scales to 1 and ignore epsilon only for this hand calculation.
    steps:
    - The mean square is (9 + 16) / 2 = 12.5; its square root is approximately 3.536.
    - The output is approximately (0.849,1.131). Its mean square is 1.
    - Its mean is about 0.990, not zero. This demonstrates why RMSNorm is different from mean-centering LayerNorm.
    result: A root-mean-square operation is identifiable from the computation, not from an epsilon value or a weight
      tensor name.
  pitfalls:
  - Sandwich normalization describes placement, not the normalization equation.
  - A class named RMSNorm can be unused or overridden.
  - Do not confuse decoder normalization with query/key normalization inside attention.
  takeaway: Follow the operation into the decoder path and keep one-source code evidence labelled.
  diagram:
  - Input (3,4)
  - Root mean square 3.536
  - Output (0.849,1.131)
  related:
  - qk-norm
  - attention-residuals
  code: 'from math import sqrt

    x = [3.0, 4.0]

    epsilon = 1e-6

    rms = sqrt(sum(v*v for v in x) / len(x) + epsilon)

    print([v/rms for v in x])  # learned scales are 1'
qk-norm:
  why: Query and key magnitudes affect attention scores. Normalizing them can change that behavior, but modern implementations
    use different normalization equations and scaling conventions.
  equation: 'L2 example: q̂ = q / ||q||₂; k̂ = k / ||k||₂

    Score = scale × q̂ᵀk̂

    An RMS-normalized implementation uses a different denominator.'
  symbols:
    scale: May be fixed or learned depending on the method.
    q̂ / k̂: Normalized query and key vectors in this illustrative L2 variant.
  example:
    setup: Take q=(3,4) and k=(0,5). This example uses L2 normalization, not a claim about every QK-Norm model.
    steps:
    - The original dot product is 20.
    - Both vectors have L2 norm 5, giving q̂=(0.6,0.8) and k̂=(0,1).
    - Their normalized dot product is 0.8 before any additional scale. An RMSNorm variant would produce different
      numerical values.
    result: The generic QK-Norm tag identifies placement. The exact norm algorithm needs its own evidence.
  pitfalls:
  - Query/key norm tensors alone do not describe the full score computation.
  - QK-Norm does not imply that all decoder norms use RMSNorm.
  - Preserve head axis, learned scaling and whether both queries and keys are normalized.
  takeaway: Inspect where normalization is applied before comparing its effect across models.
  diagram:
  - Query and key vectors
  - Normalize each vector
  - Scaled attention score
  related:
  - rmsnorm
  - mha
  - gqa
rope:
  why: Attention needs a way to express position relationships. Rotary embeddings transform pairs of query/key features
    by position-dependent angles, making their dot products sensitive to relative position.
  equation: 'R(θ)[x,y] = [x cosθ − y sinθ, x sinθ + y cosθ]

    (R(θ₁)q)ᵀ(R(θ₂)k) = qᵀR(θ₂−θ₁)k'
  symbols:
    θ: Rotation angle for one feature pair.
    R: Two-dimensional rotation; a full head contains multiple feature pairs.
  example:
    setup: Rotate the vector (1,0) by 90 degrees in one two-dimensional feature pair.
    steps:
    - cos90°=0 and sin90°=1.
    - The rotated vector is (0,1); its length remains 1.
    - If only part of a head is rotary, the remaining components are not rotated. Actual frequencies and scaling
      settings determine the angles for each pair.
    result: Position encoding, rotary fraction and context-extension scaling are related but separate facts.
  pitfalls:
  - A theta value alone does not prove that every attention path applies RoPE.
  - A scaling factor is not a measured long-context accuracy result.
  - Different local and global paths can use different frequencies or rotary fractions.
  takeaway: Retain per-path parameters rather than flattening every setting into one RoPE badge.
  diagram:
  - Original vector (1,0)
  - Rotate 90 degrees
  - Rotated vector (0,1)
  related:
  - nope
  - gqa
  - mla
silu:
  why: An activation turns a linear projection into a nonlinear computation. SiLU multiplies its input by a sigmoid,
    producing a smooth response that can retain small negative outputs.
  equation: 'SiLU(x) = x × sigmoid(x)

    sigmoid(x) = 1 / (1 + exp(−x))'
  symbols:
    x: One scalar activation value.
    exp: Exponential function.
  example:
    setup: 'Evaluate three scalar inputs: −1, 0 and 1.'
    steps:
    - sigmoid(−1)≈0.269, so SiLU(−1)≈−0.269.
    - SiLU(0)=0.
    - sigmoid(1)≈0.731, so SiLU(1)≈0.731. In a gated FFN this activation may be multiplied by a separate projection.
    result: SiLU and a SiLU-gated FFN are different levels of description.
  pitfalls:
  - SiTU-GLU is not another spelling of SiLU.
  - A Mamba component can use SiLU while the FFN uses another activation.
  - Keep the activation approximation or variant when the source names one.
  takeaway: Use the exact source activation and its component scope.
  diagram:
  - Scalar input
  - Sigmoid modulation
  - Nonlinear output
  related:
  - moe
  - latent-moe
nope:
  why: An attention path can omit an explicit position transform while retaining its causal visibility rules. This
    is a positive architecture choice, not a conclusion drawn from a missing metadata key.
  equation: 'Without an explicit positional transform:

    score(i,j) = qᵢᵀkⱼ / √d

    Visibility can still depend on a causal mask.'
  symbols:
    i / j: Query position and a visible key position.
    NoPE: Scope-specific absence of an explicit positional encoding operation.
  example:
    setup: Consider two identical content-derived query/key pairs at different position labels, with no positional
      transform on the path.
    steps:
    - Their raw content dot products are the same in this controlled example.
    - A causal mask can still exclude a future key, so the visible attention calculation need not be identical.
    - Other layers or the representations themselves can carry position-related information. NoPE does not mean
      the whole model is position-blind.
    result: The relevant question is which path omits the transform and what other information reaches it.
  pitfalls:
  - Missing RoPE metadata means unknown.
  - A NoPE MLA path can coexist with positional encoding elsewhere.
  - Do not report a RoPE-to-NoPE change if both source records already state NoPE.
  takeaway: Prefer a scoped statement over an all-model positional claim.
  diagram:
  - Content-derived Q and K
  - No explicit position transform
  - Causal attention still applies
  related:
  - rope
  - mla
  - dsa
gated-attention:
  why: 'A gate can regulate the information leaving an attention computation. Its input and multiplication point
    matter: an attention-output gate is different from routing experts or gating a feed-forward branch.'
  equation: 'Output = g ⊙ attention_output

    Example sigmoid gate: g = sigmoid(Wg h)'
  symbols:
    ⊙: Element-wise multiplication.
    h: The gate input; confirm its actual source in the model.
  example:
    setup: Let an attention output be (2,4) and its gate be (0.25,0.75).
    steps:
    - Multiply the corresponding components to obtain (0.5,3).
    - This example changes the output but not which keys and values were stored.
    - A head-wise gate may share one value across the dimensions of a head; a dimension-wise gate has a different
      shape.
    result: The gate is part of the dataflow, so record its shape and where its input comes from.
  pitfalls:
  - A tensor named gate_proj in an MLP is not attention-output gating.
  - A recurrent decay gate is not necessarily this mechanism.
  - Gate presence alone supplies no cache-compression factor.
  takeaway: Use projection shapes and the forward multiplication together.
  diagram:
  - Attention output (2,4)
  - Gate (0.25,0.75)
  - Output (0.5,3)
  related:
  - gqa
  - linear-attention
  - gated-residuals
hybrid-attention:
  why: Different mixers retain history in different ways. Combining attention with recurrent or convolutional mixers
    creates a model whose memory is a sum of several behaviors, rather than one uniform KV-cache formula.
  equation: "Toy hybrid state = attention_layers × growing_cache_per_layer\n                 + recurrent_layers\
    \ × fixed_state_per_layer"
  symbols:
    hybrid: 'Here: attention plus a linear, recurrent, convolutional or state-space decoder mixer.'
  example:
    setup: 'Build a toy four-layer decoder: recurrent, recurrent, full attention, recurrent.'
    steps:
    - There are four decoder layers, including three recurrent layers and one attention layer.
    - If each recurrent layer needs 1 KiB and the attention layer needs 2 KiB per token, the persistent state at
      100 tokens is 3 + 200 = 203 KiB.
    - A convolution nested inside a recurrent layer belongs to that layer’s state; it does not create a fifth decoder
      layer.
    result: The growing and constant terms must both remain visible.
  pitfalls:
  - The term hybrid has multiple uses in papers. This guide states ArchWatch’s matching definition.
  - Local/global softmax attention alone is not this catalog category.
  - Do not assume all recurrent mechanisms share one state formula.
  takeaway: Read the layer schedule before choosing a memory model.
  diagram:
  - Recurrent mixer
  - Attention mixer
  - Recurrent mixer
  - Combined persistent state
  related:
  - linear-attention
  - mamba2
  - kv-cache
dsa:
  why: An indexed attention path separates position selection from the main attention computation. The selector
    can score many positions while the main operation uses a smaller selected set.
  equation: 'Indices = topk(indexer_scores, k)

    Output = attention(query, retained_K[Indices], retained_V[Indices])'
  symbols:
    k: The selection budget for the main operation.
    indexer: A separate scoring path with its own parameters and potentially retained state.
  example:
    setup: For eight retained positions, let the indexer select positions 1, 4 and 7 for the current query.
    steps:
    - The selector returns three indices.
    - The main sparse attention reads the corresponding representations.
    - Future queries may select other positions, so retaining all eight can still be necessary. Add any indexer
      key storage to the main cache representation.
    result: Fewer attended positions and fewer retained positions are different claims.
  pitfalls:
  - Do not reuse a generic GQA cache formula for an MLA-based sparse path.
  - An indexer’s head geometry can differ from the main attention geometry.
  - Top-k expert routing is not DSA.
  takeaway: Keep selector, main attention and cache representation separate in the diagram.
  diagram:
  - Position indexer
  - Select positions 1,4,7
  - Main sparse attention
  related:
  - sparse-attention
  - mla
  - index-sharing
attention-residuals:
  why: Transformer depth also involves combining earlier representations. Attention residuals make that aggregation
    selective rather than assigning every preceding contribution a fixed unit weight.
  equation: 'Toy depth aggregation = Σᵢ αᵢ hᵢ

    α = softmax(depth_scores)'
  symbols:
    hᵢ: Earlier layer or block representations, not token keys.
    α: Input-dependent aggregation weights.
  example:
    setup: Take two earlier scalar representations, 2 and 6, with normalized aggregation weights 0.25 and 0.75.
    steps:
    - The weighted aggregate is 0.25 × 2 + 0.75 × 6 = 5.
    - Uniformly summing those two representations would give 8, a different operation.
    - Block variants group the representations being aggregated; a block-size field must preserve that scope.
    result: This is attention through depth, distinct from token-wise attention over a sequence.
  pitfalls:
  - A residual-stream multiplier does not establish attention residuals.
  - Do not equate depth-aggregation state with a token KV cache.
  - The same decoder layer count can use a different residual aggregation scheme.
  takeaway: Look beyond mixer names when comparing how information flows through depth.
  diagram:
  - Earlier representations 2 and 6
  - Weights 0.25 and 0.75
  - Depth aggregate 5
  related:
  - mhc
  - gated-residuals
  - rmsnorm
latent-moe:
  why: Expert storage and computation can be organized around a latent width smaller than the decoder width. The
    expert pool, shared experts and latent projections then contribute different parameter groups.
  equation: "Toy expert parameters = 2 × latent_width × expert_intermediate\nToy latent projection overhead = hidden_width\
    \ × latent_width\n                              + latent_width × hidden_width"
  symbols:
    '2': Two matrices in this simplified ungated toy expert; real gated experts use another layout.
  example:
    setup: Compare a toy expert with hidden width 8 and intermediate width 3 against one working at latent width
      4.
    steps:
    - Two full-width matrices require 2 × 8 × 3 = 48 parameters per expert.
    - Two latent-width matrices require 2 × 4 × 3 = 24 parameters per expert.
    - Shared input/output latent projections add 8 × 4 + 4 × 8 = 64 parameters. Include that overhead and the router
      rather than comparing only expert matrices.
    result: A bottleneck changes the parameter grouping; it does not make projections or shared experts disappear.
  pitfalls:
  - This arithmetic example is not a gated-expert formula for a real checkpoint.
  - Do not treat active expert parameters as total model storage.
  - A generic low-rank tensor elsewhere does not establish LatentMoE.
  takeaway: Require an explicit expert latent path and matching projection geometry.
  diagram:
  - Hidden width 8
  - Expert latent width 4
  - Expert computation
  - Return to width 8
  related:
  - moe
  - silu
mtp:
  why: A checkpoint can include additional modules for predicting beyond the next immediate target. Training use,
    released module tensors and inference use are separate properties.
  equation: 'Ordinary target at position t: token t+1

    Additional prediction target: token t+2 (and possibly more)

    Stored total under a convention = decoder + separately counted modules'
  symbols:
    t: A sequence position.
    module: An additional prediction component, not automatically another ordinary decoder layer.
  example:
    setup: Imagine a 10-layer decoder with one additional prediction module containing 5 parameter units.
    steps:
    - The ordinary decoder still has 10 layers under this convention.
    - Report the extra module’s 5 parameter units separately.
    - If a config sets the prediction-module count to zero, it does not support an enabled-MTP tag. A training report
      can also describe modules not shipped in a checkpoint.
    result: Publish the actual released component and the counting convention.
  pitfalls:
  - A training objective is not proof that its head is included in released weights.
  - Do not include MTP twice in parameter totals.
  - Speculative decoding behavior needs runtime evidence beyond module presence.
  takeaway: Check module counts, weight namespaces and model-card release details together.
  diagram:
  - Decoder representation
  - Next-token head
  - Additional future-token head
  related:
  - moe
  - kv-cache
kv-sharing:
  why: Cross-layer cache sharing changes which layers produce retained representations and which consume them. A
    complete producer/consumer mapping is needed to reason about the graph and cache.
  equation: 'Unique cache producers = unique(source_layer for each consumer)

    Toy cache = Σ(cache for each unique producer)'
  symbols:
    source_layer: The layer supplying a consumer’s KV representation; preserve the source index convention.
  example:
    setup: Use four attention layers with source mapping [0,1,1,3]. Each unique producer retains 1 MiB in this toy
      example.
    steps:
    - Layers 0, 1 and 3 are distinct producers.
    - Layer 2 reuses layer 1’s representation, leaving three unique producer caches.
    - The simple total is 3 MiB instead of four independent 1 MiB caches, provided the implementation genuinely
      shares them under these assumptions.
    result: The mapping, not just the word shared, determines the accounting.
  pitfalls:
  - Sharing index selections is not sharing KV tensors.
  - Within-layer key/value projection tying is a separate property.
  - A short list of producer anchors must not be expanded into an invented full mapping.
  takeaway: Hold memory estimates until producer/consumer semantics are qualified.
  diagram:
  - Producer layer 1
  - Shared KV representation
  - Consumers 1 and 2
  related:
  - index-sharing
  - kv-cache
looped-transformer:
  why: A decoder can apply a shared group of layers repeatedly. This changes computational depth without storing
    an independent parameter set for every unrolled pass.
  equation: 'Stored shared-block parameters = layers × parameters_per_layer

    Unrolled block applications = layers × recurrent_passes'
  symbols:
    recurrent_passes: How many times the shared block is applied, not a multiplier on stored weights.
  example:
    setup: Take a shared block of three layers with 100 parameter units each, applied twice.
    steps:
    - The shared block stores 300 parameter units.
    - It performs six layer applications across the two passes.
    - Input/output layers, extra modules and per-pass cache policy remain separate. The cache may be shared or distinct
      across passes depending on the implementation.
    result: Stored depth, unrolled depth and cache policy are different facts.
  pitfalls:
  - Do not count shared weights once per pass.
  - A recurrent-loop count does not define how past tokens are cached.
  - Repeated decoding steps are not necessarily a looped transformer architecture.
  takeaway: Inspect parameter identity and recurrence-specific cache updates.
  diagram:
  - Input layers
  - 'Shared block: pass 1'
  - 'Same block: pass 2'
  - Output layers
  related:
  - kv-cache
  - hybrid-attention
qwen-sparse-attention:
  why: A family-specific sparse path needs its own selection and grouping semantics. A generic sparse-attention
    label cannot substitute for those details.
  equation: Family-specific selection → selected groups → main attention
  symbols:
    groups: Units selected by the actual indexer; they must not be assumed to be individual tokens.
  example:
    setup: Imagine two selected groups of four positions each.
    steps:
    - The selector returns two groups, not necessarily two tokens.
    - Expanding the groups can expose up to eight positions under this illustrative grouping.
    - The actual family rule must establish grouping, overlap and cache representation before a graph or memory
      calculation is published.
    result: Top-k has meaning only after the selected unit is known.
  pitfalls:
  - Do not substitute a DSA rule merely because both paths use an indexer.
  - Do not infer this path from a generic linear-attention flag.
  - Grouping metadata alone does not qualify an end-to-end cache formula.
  takeaway: Preserve the explicit family layer kind and qualify its implementation.
  diagram:
  - Family indexer
  - Selected groups
  - Main attention
  related:
  - sparse-attention
  - dsa
ple:
  why: An additional embedding path can inject token-dependent information at designated depths. Its schedule is
    separate from both the main vocabulary embedding and n-gram memory.
  equation: h′ₗ = injectₗ(hₗ, embeddingₗ[token])
  symbols:
    inject: A model-specific combination or projection; the name PLE does not define it.
    l: A source-layer index whose base must be retained.
  example:
    setup: A source lists PLE layer IDs [2,5] with width 4.
    steps:
    - The schedule identifies two designated injection sites under that source’s index convention.
    - If the IDs are zero-based, they correspond to human-numbered layers 3 and 6. A one-based source would mean
      layers 2 and 5.
    - 'Width 4 alone is insufficient to count embedding parameters: the vocabulary, sharing and projection layout
      are also needed.'
    result: Extract the declared schedule without inventing the injection arithmetic or table shape.
  pitfalls:
  - Do not reinterpret a list of n-gram memory layers as PLE.
  - Do not assume the extra path is simple addition.
  - Do not discard layer-index conventions.
  takeaway: Keep configured injection sites as evidence while qualifying the actual operation.
  diagram:
  - Additional embedding path
  - Designated decoder depth
  - Model-specific injection
  related:
  - rope
  - moe
csa-hca:
  why: Compressed attention can combine sequence compression with different attention selection policies. Compression
    and sparsity are separate choices and can vary by layer.
  equation: 'Toy compressed positions = sequence_positions / compression_ratio

    CSA-like example: attend to selected compressed positions

    HCA-like example: attend densely to a more compressed sequence'
  symbols:
    toy: These ratios illustrate the distinction; they are not checkpoint constants.
  example:
    setup: Start with 16 positions. Compare compression by 4 followed by selection of 2 groups, against compression
      by 8 with dense attention.
    steps:
    - The first path produces four compressed positions, then selects two.
    - The second produces two compressed positions and attends to both.
    - The two paths can use the same number of attended compressed positions while retaining different representations
      and using different selection work.
    result: An attended-position count alone does not describe compression or cache.
  pitfalls:
  - Do not map arbitrary compression ratios to canonical CSA/HCA labels without a qualified family rule.
  - Compressed width and compressed sequence length are different dimensions.
  - Keep local windows and indexer state in the calculation when required.
  takeaway: Preserve compression schedule, selection policy and stored representation separately.
  diagram:
  - Sequence positions
  - Compression schedule
  - Sparse or dense compressed attention
  related:
  - mla
  - dsa
  - kv-cache
mhc:
  why: Multiple residual streams create more ways to mix information through depth. Constraining the mixing matrix
    changes what transformations are allowed; a stream count alone does not establish the constraint.
  equation: 'Toy mixing matrix M = [[0.8,0.2],[0.2,0.8]]

    M rows sum to 1; M columns sum to 1

    y = Mx'
  symbols:
    M: An illustrative doubly stochastic matrix, not a trained checkpoint matrix.
  example:
    setup: Apply the displayed matrix to two scalar streams x=(2,6).
    steps:
    - The first output is 0.8 × 2 + 0.2 × 6 = 2.8.
    - The second is 0.2 × 2 + 0.8 × 6 = 5.2.
    - The sum remains 8 in this example. This illustrates a constrained mixing property, not the complete read/write
      mapping or training procedure.
    result: Constrained mixing and generic residual multiplication are different architecture claims.
  pitfalls:
  - hc_mult alone is insufficient evidence.
  - A Sinkhorn setting is a lead until its role in the active residual computation is established.
  - Residual state is not the attention KV cache.
  takeaway: Inspect the constraint and the active residual path before assigning the canonical tag.
  diagram:
  - Two residual streams
  - Constrained mixing matrix
  - Mixed streams 2.8 and 5.2
  related:
  - attention-residuals
  - gated-residuals
index-sharing:
  why: Position selection can be reused even when attention layers keep separate key/value representations. This
    saves a kind of selection work without automatically sharing the main cache.
  equation: 'Indices for consumer layer = indices from producer layer

    KV cache sharing is a separate relation.'
  symbols:
    producer: The layer computing an index selection.
    consumer: A layer reusing that selection.
  example:
    setup: One producer selects positions [1,4]. Two attention layers reuse those indices.
    steps:
    - Both consumers can read the same selected positions.
    - They may still read different key/value tensors belonging to their own attention projections.
    - The reuse therefore does not establish a twofold cache reduction. A complete mapping is needed to count producers
      or selection computations.
    result: Shared selections and shared representations must remain separate in both the schema and diagram.
  pitfalls:
  - A shared-mode flag need not name its producer.
  - Do not infer KV reuse from indexer reuse.
  - Preserve explicit source schedules rather than guessing periodic reuse.
  takeaway: Name what is shared before calculating a saving.
  diagram:
  - Indexer producer
  - Selection [1,4]
  - Two attention consumers
  related:
  - kv-sharing
  - dsa
gated-residuals:
  why: Gates can control how residual streams are read or updated. The residual path is distinct from the attention-output
    and feed-forward paths, even when all use sigmoid-like gates.
  equation: 'Illustrative read: h = r₁s₁ + r₂s₂

    Illustrative write: s′ = s + w × f(h)'
  symbols:
    r / w: Read and write gates; actual constraints and placements are model-specific.
  example:
    setup: Read scalar streams 2 and 6 with weights 0.2 and 0.8.
    steps:
    - The read result is 0.2 × 2 + 0.8 × 6 = 5.2.
    - If a branch produces 4 and its write gate is 0.5, its gated contribution is 2.
    - Where that contribution is written, and how streams mix, must come from the family’s implementation. These
      scalar examples are not its complete residual formula.
    result: The gate’s location is part of the mechanism, not a naming detail.
  pitfalls:
  - An attention gate is not evidence of gated residual streams.
  - A generic hyper-connection count does not determine read/write semantics.
  - Do not assume mHC constraints for an unconstrained gated residual design.
  takeaway: Qualify read, write and stream mixing independently.
  diagram:
  - Residual streams
  - Read/write gates
  - Updated streams
  related:
  - gated-attention
  - mhc
attention-budgeting:
  why: Architecture designers can allocate different query-head capacity to local and global attention paths. Query
    work and retained KV geometry must then be reasoned about separately.
  equation: 'Toy head allocation = Σ(query heads in each layer)

    KV bytes still depend on KV heads and retained context.'
  symbols:
    allocation: A structural count, not a measured latency or API request budget.
  example:
    setup: Take four layers with query-head counts [2,8,8,8], while every layer retains 2 KV heads of the same width.
    steps:
    - The query-head allocation totals 26, compared with 32 if every layer had eight query heads.
    - This difference does not, by itself, reduce KV storage because all four layers still have two KV heads.
    - If some layers use local windows, their retained-token counts also differ. Use the complete per-path geometry
      and schedule.
    result: Lower query-head allocation and smaller cache are not interchangeable claims.
  pitfalls:
  - A generic index_topk is a different kind of budget.
  - Do not flatten a head-count vector into one global value.
  - Architecture allocation does not directly predict measured throughput.
  takeaway: Compare query geometry, KV geometry and visibility policy side by side.
  diagram:
  - Local/global schedule
  - Per-layer query-head allocation
  - Per-path attention work
  related:
  - sliding-window
  - gqa
cca:
  why: Attention can operate inside a compressed latent space instead of expanding representations to full width
    before the attention calculation. CCA combines latent attention with convolutional mixing; grouped-query compression
    is a related variant.
  equation: 'Compressed projections: Qc, Kc, Vc

    Toy attention inner product width = latent_width

    Toy latent KV bytes = T × (key_latent_width + value_latent_width) × b'
  symbols:
    T / b: Retained positions / bytes per latent value.
    toy: Convolution state and other family-specific terms are omitted from this illustrative equation.
  example:
    setup: Use four positions, a hidden width of 8 and equal key/value latent widths of 2 stored in bf16.
    steps:
    - The latent KV vectors require 4 × (2 + 2) × 2 = 32 bytes under the stated toy assumptions.
    - The score matrix still relates four positions to four positions; compression changes the inner representation
      width, not automatically the position count.
    - The actual CCA implementation also needs its convolution and other retained-state rules qualified.
    result: Width compression and sequence compression are different design axes.
  pitfalls:
  - Do not treat CCA as another name for generic causal attention.
  - Do not substitute an MLA cache rule without checking what CCA retains.
  - A conceptual example does not qualify a new model’s runtime formula.
  takeaway: Read latent dimensions, convolution mixing and head sharing together.
  diagram:
  - Compress Q/K/V
  - Convolutional latent mixing
  - Attention in latent space
  related:
  - mla
  - gqa
  - short-convolution
polynorm:
  why: An expert-specific learned polynomial can change the nonlinear operation in a feed-forward path. Its coefficients
    and placement are part of the architecture; the word norm does not make it decoder RMSNorm.
  equation: 'Illustrative polynomial P(x) = a₀ + a₁x + a₂x²

    Actual degree, normalization and coefficients are implementation-specific.'
  symbols:
    illustrative: This is polynomial arithmetic for learning, not Motif’s full operator.
  example:
    setup: Choose toy coefficients a₀=0, a₁=1 and a₂=0.5, and input x=2.
    steps:
    - The linear term is 2.
    - The quadratic term is 0.5 × 2² = 2, so P(2)=4.
    - An expert-specific design can learn different coefficients for different experts. Verify the actual parameterization
      and any normalization or clipping in code.
    result: The exact nonlinear operator must retain its variant and expert scope.
  pitfalls:
  - Do not relabel PolyNorm as SiLU.
  - Do not infer RMSNorm from the substring norm.
  - Degree and coefficient sharing cannot be recovered from the model name alone.
  takeaway: Inspect the primary expert implementation and its coefficient tensors.
  diagram:
  - Expert input
  - Learned polynomial operation
  - Expert output
  related:
  - silu
  - moe
  - rmsnorm
