cca:
  reviewed: false
  title: Compressed convolutional attention
  short: CCA
  category: Attention
  summary: Attention runs on compressed queries, keys and values in a shared latent space, with a convolution mixing the compressed
    queries and keys.
  mechanism: The layer projects queries, keys and values into a narrower latent width, mixes the compressed queries and keys
    with a short convolution and computes attention at that width. A grouped-query variant also shares key-value heads.
  memory: The cache holds the compressed keys and values; the convolution adds a few past inputs. ArchWatch has no checked
