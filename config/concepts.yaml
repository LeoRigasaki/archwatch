# Educational definitions and deterministic rules; never a source of model facts.
# reviewed: false until the owner has read the guide; the site labels unreviewed guides as drafts.
# Every source is a paper or the model's own files.
mha:
  reviewed: false
  title: Multi-head attention
  short: MHA
  category: Attention
  summary: Every query head has its own key head and value head. It is the baseline that the other attention layouts save
    memory against.
  mechanism: Each head projects the token into its own query, key and value, scores the query against the keys of every visible
    token, turns the scores into weights with softmax and takes the weighted sum of the values. The heads run in parallel
    on different projections; their outputs are concatenated and projected back to the model width.
  memory: 'Each head caches its own key and value, so the cache per token is 2 × heads × head width × bytes × layers: the
    largest of any layout with the same heads.'
  verify: num_key_value_heads equals num_attention_heads in config.json, and k_proj and v_proj in the weight headers are as
    wide as q_proj.
  flow:
  - Token representations
  - Separate query / key / value heads
  - Attend and combine
  source:
    title: Attention Is All You Need
    url: https://arxiv.org/abs/1706.03762
  rule:
    field: attention_type
    equals: MHA
  scope: Attention heads in the decoder.
  aliases: []
  catalog: requested
gqa:
  reviewed: false
  title: Grouped-query attention
  short: GQA
  category: Attention
  summary: Groups of query heads share one key-value head, so each token caches fewer keys and values.
  mechanism: Multi-head attention has one key-value head per query head. GQA keeps every query head but gives each group of
    Hq / Hkv query heads a single shared key head and value head. Queries in a group still attend differently; they read the
    same keys and values. Multi-query attention (MQA) is the limit with one key-value head for all queries.
  memory: The cache shrinks by the group size Hq / Hkv. The key and value projections shrink by the same factor, so the weights
    get slightly smaller too. Compute per token barely changes.
  verify: Compare num_attention_heads with num_key_value_heads in config.json, and check that the k_proj and v_proj weights
    are Hkv × head_dim wide.
  flow:
  - Many query heads
  - Shared key-value groups
  - Attend and combine
  source:
    title: GQA paper
    url: https://arxiv.org/abs/2305.13245
  rule:
    field: attention_type
    one_of:
    - GQA
    - MQA
  scope: Grouped query/key-value heads in the decoder.
  aliases:
  - MQA
  - Grouped query attention
  - Multi-query attention
  catalog: requested
moe:
  reviewed: false
  title: Mixture of experts
  short: MoE
  category: Feed-forward
  summary: A feed-forward layer is split into many experts, and a router sends each token to a few of them, so a token uses
    only part of the stored parameters.
  mechanism: Instead of one large feed-forward network, the layer holds N experts. A small router scores them for each token
    and keeps the top k. The token passes through those k experts, plus any shared experts that every token uses, and their
    outputs are summed, weighted by the router scores. Attention layers are unchanged.
  memory: Every expert has to be in memory, or offloaded, because the next token can pick any of them. Weight memory follows
    the total parameters; compute per token follows the active parameters.
  verify: Read the number of routed experts, experts per token and shared experts in config.json, and count the expert tensors
    in the weight headers.
  flow:
  - Token
  - Router selects experts
  - Selected experts and shared path
  - Combine outputs
  source:
    title: Switch Transformers
    url: https://arxiv.org/abs/2101.03961
  rule:
    all:
    - field: moe_num_experts
      positive: true
    - field: moe_active_experts
      positive: true
  scope: Routed feed-forward experts.
  aliases:
  - Mixture of experts
  catalog: requested
mla:
  reviewed: false
  title: Multi-head latent attention
  short: MLA
  category: Attention
  summary: Each layer caches one compressed vector per token instead of a key and a value for every head, and rebuilds the
    per-head keys and values from it when attending.
  mechanism: A down-projection compresses the token's hidden state into a latent vector of width kv_lora_rank, and that vector
    is what the layer caches. At attention time, up-projections expand it into per-head keys and values, or are folded into
    the query and output projections so the expanded keys and values are never materialized. Rotary position encoding cannot
    pass through the compression, so each token also caches one small rotary key, qk_rope_head_dim wide and shared by all
    heads.
  memory: 'Cache per token per layer = (kv_lora_rank + qk_rope_head_dim) × bytes per value, whatever the number of heads.
    The saving costs compute: extra projection weights and matrix multiplies at every step.'
  verify: Read kv_lora_rank and qk_rope_head_dim in config.json and find the compressed kv_a_proj tensor in the weight headers.
    If the model also has a sparse-attention indexer, its keys are cached as well and must be added.
  flow:
  - Token representations
  - Compressed key-value latent
  - Attention output
  source:
    title: DeepSeek-V2 report
    url: https://arxiv.org/abs/2405.04434
  rule:
    all:
    - field: mla_kv_lora_rank
      positive: true
    - any:
      - field: layer_type_counts.full_attention_mla
        positive: true
      - field: layer_type_counts.gated_dsa_mla
        positive: true
      - field: layer_type_counts.indexed_mla
        positive: true
  scope: Latent key-value attention paths.
  aliases:
  - Multi-head Latent Attention
  catalog: requested
sliding-window:
  reviewed: false
  title: Sliding-window attention
  short: Sliding window
  category: Attention
  summary: A layer attends only to the last W tokens, so its cache stops growing once it holds W tokens.
  mechanism: 'Each query sees the W most recent positions instead of the whole prefix. The layer''s cache works as a ring
    buffer: when token W + 1 arrives, the oldest entry is overwritten. Older text still reaches the current token indirectly,
    through earlier layers that saw it inside their own windows.'
  memory: Per layer, cache = per-token cost × min(T, W). Below W tokens it costs exactly as much as full attention; past W
    it stays flat. In a model that mixes sliding and full layers, the full layers keep growing.
  verify: Read sliding_window in config.json together with the per-layer pattern (layer_types or a sliding-window pattern).
    A window value in the config does not mean every layer uses it.
  flow:
  - Earlier context
  - Recent retained window
  - Current token
  source:
    title: Mistral 7B report
    url: https://arxiv.org/abs/2310.06825
  rule:
    all:
    - any:
      - field: layer_type_counts.sliding_attention
        positive: true
    - field: sliding_window
      positive: true
  scope: Only the published sliding-attention layers.
  aliases:
  - SWA
  - Sliding Window Attention
  catalog: requested
linear-attention:
  reviewed: false
  title: Linear attention and recurrent state
  short: Linear attention
  category: Persistent state
  summary: The layer replaces the growing key-value cache with a fixed-size state matrix that it updates at every token.
  mechanism: Each head keeps a state matrix of key width × value width. For each token the layer writes the new key and value
    into that state and reads its output by multiplying the query with it; nothing is stored per token. Delta-rule variants
    such as KDA decay old content channel by channel and overwrite the entry for the current key instead of only adding to
    it, which keeps the state from filling up with stale information.
  memory: State per head = key width × value width × bytes, usually fp32, and the same at any context length. Small convolutions
    on q, k and v keep a few past inputs as well. Hybrid models keep some full-attention or MLA layers, and their cache still
    grows.
  verify: Read the linear-attention head count, head width and convolution kernel in config.json, and the layer pattern to
    see which layers are linear.
  flow:
  - Previous state and token
  - Recurrent state update
  - New state and output
  source:
    title: Transformers are RNNs
    url: https://arxiv.org/abs/2006.16236
  rule:
    any:
    - field: layer_type_counts.kda_linear
      positive: true
    - field: layer_type_counts.linear_attention
      positive: true
    - field: layer_type_counts.gated_delta_net
      positive: true
  scope: Linear/recurrent attention paths; the update rule remains family-specific.
  aliases:
  - KDA
  - Kimi Delta Attention
  catalog: companion
sparse-attention:
  reviewed: false
  title: Sparse attention
  short: Sparse attention
  category: Attention
  summary: Each query attends to a selected subset of earlier positions instead of all of them, which caps the attention work
    per token. Every position stays cached so later queries can select it.
  mechanism: 'A selector picks which cached positions a query uses: a fixed pattern such as local blocks, or a learned scorer
    such as DeepSeek sparse attention. The main attention then runs softmax over only those positions, so the work per token
    is set by the selection budget k, not by the context length.'
  memory: 'The cache does not shrink: any position can be selected later, so all are kept. A learned selector caches its own
    small key per token on top.'
  verify: Find the selection rule and budget in config.json (for example index_topk) and the selector in the modelling code.
  flow:
  - Cached positions
  - Position selector
  - Attention over selected positions
  source:
    title: DeepSeek-V3.2 experimental base model card
    url: https://huggingface.co/deepseek-ai/DeepSeek-V3.2-Exp-Base
  rule:
    any:
    - field: layer_type_counts.gated_dsa_mla
      positive: true
    - field: layer_type_counts.indexed_mla
      positive: true
    - field: layer_type_counts.qwen_sparse_attention
      positive: true
  scope: Published sparse/indexed attention paths.
  aliases:
  - Sparse attention
  catalog: companion
mamba2:
  reviewed: false
  title: Mamba-2 state-space layers
  short: Mamba-2
  category: Persistent state
  summary: A state-space layer folds the sequence into a fixed-size state, updated once per token, instead of caching keys
    and values.
  mechanism: Each head keeps a state of head width × state size. For every token the layer decays the state by a factor computed
    from the input, adds the token's contribution and reads the output from the state. A short causal convolution before the
    update mixes the last few inputs. Nothing grows with the context.
  memory: State per layer = heads × head width × state size × bytes, plus the convolution's past inputs. Hybrid models add
    the cache of their attention layers.
  verify: Read the head count, head dimension, state size, convolution kernel and the layer pattern in config.json.
  flow:
  - Input and previous state
  - State-space update
  - Output and next state
  source:
    title: Transformers are SSMs
    url: https://arxiv.org/abs/2405.21060
  rule:
    any:
    - field: layer_type_counts.mamba2
      positive: true
  scope: Mamba-2 mixer layers.
  aliases:
  - Mamba-2
  - SSD
  catalog: companion
short-convolution:
  reviewed: false
  title: Short convolution
  short: Short conv
  category: Persistent state
  summary: Each channel is filtered over the last few tokens with a small learned kernel, so the layer needs a few past inputs,
    never a growing cache.
  mechanism: A depthwise convolution gives every channel its own kernel of K weights and combines the current input with the
    previous K − 1. In Liquid's LFM models an input projection produces the signal and two gates; the gated signal is convolved,
    gated again and projected back to the model width.
  memory: State per layer = channels × (K − 1) past inputs × bytes, the same at any context length.
  verify: Read the kernel size (conv_L_cache in LFM configs) and the layer pattern in config.json, and the conv weight shape
    [channels, 1, K] in the weight headers.
  flow:
  - Recent token buffer
  - Gated convolution
  - Output and updated buffer
  source:
    title: Liquid AI primary model files
    url: https://huggingface.co/LiquidAI/LFM3-1.7B-Base
  rule:
    any:
    - field: layer_type_counts.short_conv
      positive: true
    - field: layer_type_counts.kda_linear
      positive: true
  scope: Short-convolution operation, with its nesting recorded.
  aliases:
  - ShortConv
  - Short convolution
  catalog: requested
kv-cache:
  reviewed: false
  title: The key-value cache
  short: KV cache
  category: Memory planning
  summary: While a model generates text, each attention layer keeps the keys and values of every earlier token so it never
    recomputes them. That store is the KV cache, and it grows by one entry per layer for every token.
  mechanism: 'For each new token, an attention layer computes one key and one value per key-value head, appends them to its
    cache and attends over everything stored so far. Token 1,000 reads 999 cached entries per layer instead of re-running
    the first 999 tokens. Other layer types store less: a sliding-window layer keeps the last W tokens, an MLA layer keeps
    one compressed vector and a linear-attention layer keeps a fixed-size state.'
  memory: 'Cache per token = 2 × key-value heads × head width × bytes per value × attention layers. Multiply by the context
    length and by the number of sequences served at once. The cache is separate from the weights: 4-bit weights still write
    a 16-bit cache unless the runtime quantizes the cache too.'
  verify: Read num_key_value_heads, head_dim and num_hidden_layers from config.json. Then check the layer pattern for layers
    that keep a window or a fixed state instead of a full cache.
  flow:
  - Model weights
  - Persistent decoding state
  - Runtime and device overhead
  source:
    title: Efficiently Scaling Transformer Inference
    url: https://arxiv.org/abs/2211.05102
  rule:
    any:
    - field: layer_type_counts.full_attention
      positive: true
    - field: layer_type_counts.sliding_attention
      positive: true
    - field: layer_type_counts.full_attention_mla
      positive: true
    - field: layer_type_counts.gated_dsa_mla
      positive: true
  scope: Attention cache and any companion persistent state.
  aliases:
  - Key-value cache
  catalog: companion
rmsnorm:
  reviewed: false
  title: Root mean square normalization
  short: RMSNorm
  category: Normalization
  summary: Divide a vector by its root mean square and multiply by learned scales. Unlike LayerNorm, it does not subtract
    the mean.
  mechanism: For each token the layer squares every component, takes the mean, adds a small ε, takes the square root and divides
    the vector by it. Each component is then multiplied by its own learned scale. Decoders apply it before each attention
    and feed-forward block; sandwich designs also apply it after.
  memory: Each norm stores one scale per channel and adds no cache.
  verify: Find the RMSNorm class in the modelling code and check that it computes mean(x²) without subtracting the mean. The
    weight headers show one [hidden] scale tensor per norm.
  flow:
  - Input representation
  - Inverse root mean square
  - Rescale representation
  source:
    title: RMSNorm paper
    url: https://arxiv.org/abs/1910.07467
  rule:
    field: normalization_type
    equals: RMSNorm
  scope: Decoder normalization modules.
  aliases: []
  catalog: requested
qk-norm:
  reviewed: false
  title: Query-key normalization
  short: QK-Norm
  category: Normalization
  summary: Normalize each head's query and key before they are multiplied, so attention scores cannot blow up.
  mechanism: After the query and key projections, each head's query and key pass through a norm with a learned scale of head
    width; one scale vector serves every head. The rotary position is applied next, and the scores are computed as usual.
  memory: Two small scale vectors per layer and no change to the cache.
  verify: Find q_norm and k_norm tensors of shape [head_dim] in the weight headers and the place where the code applies them.
  flow:
  - Query and key projections
  - Normalize queries and keys
  - Form attention scores
  source:
    title: QK normalization paper
    url: https://arxiv.org/abs/2010.04245
  rule:
    field: qk_norm
    equals: true
  scope: Query/key normalization; the norm equation is not implied.
  aliases:
  - QKNorm
  catalog: requested
rope:
  reviewed: false
  title: Rotary position embeddings
  short: RoPE
  category: Position encoding
  summary: Encode position by rotating pairs of query and key channels by an angle proportional to the token's position, so
    attention scores depend on the distance between tokens.
  mechanism: 'Each head''s channels are split into pairs. Pair i is rotated by position × θᵢ, with θᵢ = base^(−2i/d): the
    first pairs turn fast and the last ones very slowly. Rotating both query and key and taking their dot product leaves only
    the difference of the two angles, so the score depends on relative position. Keys are cached after rotation.'
  memory: 'No parameters and no extra cache: the rotation is computed from the position.'
  verify: Read rope_theta (the base), rope_scaling and partial_rotary_factor in config.json, and check which layers apply
    it.
  flow:
  - Query and key features
  - Position-dependent rotations
  - Position-aware attention
  source:
    title: RoFormer paper
    url: https://arxiv.org/abs/2104.09864
  rule:
    field: rope
    nonempty: true
  scope: Configured rotary position encoding.
  aliases:
  - Rotary position embedding
  catalog: requested
silu:
  reviewed: false
  title: SiLU activation
  short: SiLU
  category: Feed-forward
  summary: SiLU(x) = x × sigmoid(x), a smooth activation, most often used inside gated feed-forward networks (SwiGLU).
  mechanism: In a SwiGLU feed-forward network the token goes through two parallel projections, gate and up. SiLU is applied
    to the gate, the result is multiplied element-wise with up, and a down projection maps it back to the model width. The
    gate decides, channel by channel, how much of the up signal passes.
  memory: A gated network has three weight matrices per layer instead of two; the activation adds no cache.
  verify: hidden_act in config.json names the activation; gate_proj, up_proj and down_proj in the weight headers show the
    gated layout.
  flow:
  - Input
  - Sigmoid-modulated activation
  - Feed-forward output
  source:
    title: SiLU paper
    url: https://arxiv.org/abs/1702.03118
  rule:
    field: activation
    one_of:
    - silu
    - swish
  scope: Feed-forward activation.
  aliases:
  - Swish
  catalog: requested
nope:
  reviewed: false
  title: Position-free attention paths
  short: NoPE
  category: Position encoding
  summary: Some attention layers use no positional encoding at all; order reaches them through other layers.
  mechanism: A NoPE attention layer computes scores from content only, with no rotation and no position embedding. The causal
    mask still hides future tokens. In hybrid models the order-aware layers (recurrent or convolutional) write position information
    into the hidden states that the NoPE layers read.
  memory: 'Dropping the rotation changes no cache size: the layer still caches its keys or latent.'
  verify: Look for an explicit flag (such as use_nope) or the missing rotary call in the code path. A missing rope setting
    means unknown, not NoPE.
  flow:
  - Query and key features
  - No positional transform on this path
  - Attention
  source:
    title: Kimi primary model files
    url: https://huggingface.co/moonshotai/Kimi-K3.1-Pro
  rule:
    all:
    - field: mla_use_nope
      equals: true
    - any:
      - field: layer_type_counts.full_attention_mla
        positive: true
      - field: layer_type_counts.gated_dsa_mla
        positive: true
  scope: MLA paths explicitly configured without position encoding.
  aliases:
  - No positional encoding
  catalog: requested
gated-attention:
  reviewed: false
  title: Gated attention outputs
  short: Gated Attention
  category: Attention
  summary: A learned gate multiplies the attention output channel by channel before the output projection, so the layer can
    switch off what it does not need.
  mechanism: From the token's hidden state the layer computes a gate vector as wide as the attention output. After attention,
    each output channel is multiplied by its gate value, and the result goes into the output projection. The gate comes from
    the current token, not from the attended positions.
  memory: One extra projection per attention layer and no change to the cache.
  verify: Find the gate projection (g_proj or gate_proj in the attention block) whose output width equals the attention output
    width, and the multiplication before o_proj in the code.
  flow:
  - Attention output
  - Learned output gate
  - Modulated output
  source:
    title: Gated attention paper
    url: https://arxiv.org/abs/2505.06708
  rule:
    field: attention_output_gate
    equals: true
  scope: Attention-output gating only.
  aliases: []
  catalog: requested
hybrid-attention:
  reviewed: false
  title: Hybrid attention and recurrent mixers
  short: Hybrid Attention
  category: Persistent state
  summary: A decoder mixes attention layers with layers that keep a fixed-size state (convolution, linear attention or state-space),
    so only the attention layers' cache grows.
  mechanism: The layer pattern decides which mixer each layer uses. Fixed-state layers handle local or compressed context
    cheaply, and a minority of attention layers keep a full cache for exact long-range lookups. ArchWatch counts a model as
    hybrid only when attention is mixed with a non-attention mixer; mixing local and global attention does not count.
  memory: Cache = attention layers × cache per layer × tokens + the fixed state of the other layers.
  verify: Read the per-layer pattern (layer_types or a block pattern) in config.json and count each layer type.
  flow:
  - Published layer schedule
  - Attention and recurrent mixers
  - Combined decoder
  source:
    title: Kimi Linear report
    url: https://arxiv.org/abs/2510.26692
  rule:
    field: layer_type_counts
    nonempty: true
  scope: Attention plus non-attention decoder mixer paths.
  aliases: []
  catalog: requested
dsa:
  reviewed: false
  title: DeepSeek sparse attention
  short: DSA
  category: Attention
  summary: DeepSeek sparse attention adds a small indexer that scores every cached position and passes the top k to the main
    MLA attention.
  mechanism: For each new token, the indexer computes a few narrow query heads and compares them with a narrow index key cached
    for every earlier position. The k highest-scoring positions go to the main MLA attention, which runs only over them. The
    indexer is cheap because its keys are narrow and it has few heads.
  memory: Each DSA layer caches the MLA latent and rotary key plus one index key per token.
  verify: Read index_topk, index_n_heads and index_head_dim in config.json, and find the indexer tensors (wk, weights_proj)
    in the weight headers.
  flow:
  - Indexer scores positions
  - Select positions
  - Sparse attention
  source:
    title: DeepSeek-V3.2 experimental card
    url: https://huggingface.co/deepseek-ai/DeepSeek-V3.2-Exp-Base
  rule:
    all:
    - any:
      - field: layer_type_counts.gated_dsa_mla
        positive: true
      - field: layer_type_counts.indexed_mla
        positive: true
    - field: dsa_index_topk
      positive: true
  scope: Identified DSA/indexed-MLA paths.
  aliases:
  - DeepSeek Sparse Attention
  catalog: requested
attention-residuals:
  reviewed: false
  title: Attention residual connections
  short: Attention Residuals
  category: Residual connections
  summary: Instead of adding every earlier layer's output with weight one, a layer takes a learned weighted mix of earlier
    representations.
  mechanism: 'A standard residual stream is a running sum: every layer adds its output and passes the total on. With attention
    residuals, a layer scores earlier representations with a learned vector, turns the scores into weights with softmax and
    uses the weighted sum as its input. The block variant groups layers into blocks, so a layer weighs a few block outputs
    instead of every earlier layer.'
  memory: One scoring vector and one norm per mixing point; no token cache.
  verify: Read attn_res_block_size in config.json and find the res_proj and res_norm tensors in each layer.
  flow:
  - Earlier block representations
  - Depth-wise weighted aggregation
  - Next block input
  source:
    title: Attention Residuals paper
    url: https://arxiv.org/abs/2603.15031
  rule:
    field: attn_res_block_size
    positive: true
  scope: Configured block attention-residual aggregation.
  aliases:
  - AttnRes
  catalog: requested
latent-moe:
  reviewed: false
  title: Latent expert computation
  short: LatentMoE
  category: Feed-forward
  summary: 'Routed experts work at a narrower latent width: the token is projected down once, every selected expert runs at
    that width, and the result is projected back.'
  mechanism: Before routing, a shared down-projection maps the hidden state to the latent width. Each selected expert's gate,
    up and down matrices run at the latent width instead of the full width, and a shared up-projection maps the combined result
    back. The two projections are paid once per layer, not once per expert.
  memory: Each expert's matrices shrink by hidden width ÷ latent width; with hundreds of experts that is most of the model.
  verify: Read the expert latent width in config.json and find the shared down and up projections next to the router in the
    weight headers.
  flow:
  - Hidden representation
  - Expert latent projection
  - Routed expert computation
  - Return to hidden width
  source:
    title: Kimi primary model files
    url: https://huggingface.co/moonshotai/Kimi-K3.1-Pro
  rule:
    all:
    - field: moe_latent_dim
      positive: true
    - field: moe_num_experts
      positive: true
  scope: Latent path of the routed experts.
  aliases:
  - Latent MoE
  catalog: requested
mtp:
  reviewed: false
  title: Multi-token prediction modules
  short: MTP
  category: Prediction modules
  summary: Extra output modules predict the token after next, in addition to the next token.
  mechanism: An MTP module takes the decoder's final hidden state at a position, combines it with the embedding of the next
    token, runs one more transformer block and predicts the token two positions ahead. DeepSeek-V3 trains with one such module
    and can use it at inference to draft a second token for speculative decoding.
  memory: MTP modules are stored weights. ArchWatch counts them separately from the decoder (params_mtp); they are needed
    at inference only when the runtime uses them to draft tokens.
  verify: Read the MTP setting (num_nextn_predict_layers in DeepSeek configs) in config.json and look for the module's tensors
    in the weight headers. A value of zero means no module.
  flow:
  - Decoder representations
  - Additional prediction modules
  - Future-token targets
  source:
    title: DeepSeek-V3 report
    url: https://arxiv.org/abs/2412.19437
  rule:
    any:
    - field: num_mtp_layers
      positive: true
    - field: params_mtp
      positive: true
  scope: Configured or shipped MTP modules, as specified by the evidence.
  aliases:
  - Multi-token prediction
  catalog: requested
kv-sharing:
  reviewed: false
  title: Key-value cache sharing across layers
  short: KV Sharing
  category: Persistent state
  summary: Some layers reuse the keys and values computed by another layer instead of caching their own, so only the producer
    layers add to the cache.
  mechanism: Each consumer layer is mapped to a source layer. During decoding, only source layers compute and cache keys and
    values; consumers attend with their own queries over the source layer's cache.
  memory: Cache = unique producer layers × cache per layer. The saving equals the share of layers that are consumers.
  verify: Read the full per-layer source mapping in config.json; a count of shared layers is not enough.
  flow:
  - Producer layer
  - Shared key-value representation
  - Consumer layers
  source:
    title: Mistral primary model files
    url: https://huggingface.co/mistralai/Mistral-Large-4-1T-A52B
  rule:
    any:
    - field: shared_kv_layers
      positive: true
    - field: kv_sharing
      nonempty: true
  scope: Cross-layer key/value reuse, not within-layer key/value tying.
  aliases: []
  catalog: requested
looped-transformer:
  reviewed: false
  title: Looped transformer blocks
  short: Looped Transformer
  category: Decoder structure
  summary: A block of layers runs several times in a row with the same weights, giving more depth without more parameters.
  mechanism: The input passes through a few unshared layers, then a shared block is applied N times, each pass feeding the
    next, then the output layers.
  memory: Weights are stored once; compute grows with the number of passes. Whether each pass keeps its own attention cache
    is set by the design and must be read from the code.
  verify: Read the number of recurrent passes and which layers belong to the shared block in config.json.
  flow:
  - Input layers
  - Repeated shared block
  - Output layers
  source:
    title: Dory primary model files
    url: https://huggingface.co/nvidia/NVIDIA-Nemotron-Labs-Dory1.0-4B-BF16
  rule:
    all:
    - field: generation_type
      equals: latent_recurrent
    - field: recurrent_loops
      greater_than: 1
  scope: Repeated shared decoder block.
  aliases:
  - Recurrent transformer
  catalog: requested
qwen-sparse-attention:
  reviewed: false
  title: Qwen sparse attention
  short: Qwen Sparse Attention
  category: Attention
  summary: Qwen's sparse attention layer, which selects groups of positions with its own indexer.
  mechanism: The layer scores groups of positions, keeps the best-scoring groups and runs attention over the positions inside
    them. The group size and selection rule come from the Qwen model files.
  memory: ArchWatch has no checked cache rule for this layer yet, so models that use it stay in review.
  verify: Require the explicit layer type in config.json; a generic sparse or linear flag does not qualify.
  flow:
  - Indexer
  - Selected groups
  - Attention
  source:
    title: Qwen primary model card
