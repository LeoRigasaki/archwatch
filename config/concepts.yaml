attention-budgeting:
  reviewed: false
  title: Layer-wise attention budgeting
  short: Attention Budgeting
  category: Attention
  summary: Different layers get different numbers of query heads, for example fewer in local layers and more in global ones.
  mechanism: The model sets a query-head count per layer or per attention type, so local and global layers can have different
