csa-hca:
  reviewed: false
  title: Compressed sparse and heavily compressed attention
  short: CSA/HCA
  category: Attention
  summary: 'DeepSeek-V4''s two compressed attention variants: CSA compresses the sequence and attends to selected compressed
    positions; HCA compresses harder and attends to all of them.'
  mechanism: Both first compress groups of positions into fewer entries. CSA then selects a subset of the compressed entries
    for each query, like sparse attention. HCA compresses more aggressively and attends densely over everything that remains.
  memory: The cache holds compressed entries, so it grows by one entry per compression group, not per token. Windows and selector
    state add their own terms.
  verify: Read each layer's variant, compression ratio and selection settings from the model files.
  flow:
  - Sequence representations
  - Variant-specific compression
  - Sparse or dense attention
  source:
    title: DeepSeek-V4 model card
    url: https://fe-static.deepseek.com/chat/transparency/deepseek-V4-model-card-EN.pdf
  rule:
    field: compressed_attention_types
