ple:
  reviewed: false
  title: Per-layer embeddings
  short: PLE
  category: Embeddings
  summary: Extra embedding tables give designated decoder layers their own token embeddings, not only the input layer.
  mechanism: Besides the main embedding, the model looks up a per-layer embedding for each token and combines it with the
    hidden state at designated layers. The combination rule and table shapes come from the model code.
  memory: Per-layer embedding tables are stored weights; they add no cache.
  verify: Read the PLE settings (width and layer IDs) in config.json and the table tensors in the weight headers.
