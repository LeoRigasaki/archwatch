mhc:
  reviewed: false
  title: Manifold-constrained hyper-connections
  short: mHC
  category: Residual connections
  summary: Several residual streams run in parallel and are mixed by a matrix constrained to be doubly stochastic, so mixing
    redistributes the signal but never amplifies it.
  mechanism: Hyper-connections widen the residual stream into several parallel streams that layers read from and write to.
    mHC projects the stream-mixing matrix onto doubly stochastic matrices (rows and columns sum to one) with Sinkhorn iterations.
  memory: 'The extra streams are activations, not cache: they add work per token but no stored history.'
  verify: Require the explicit mechanism in the model files; a stream multiplier or a Sinkhorn setting alone does not qualify.
  flow:
  - Residual streams
  - Constrained mixing
  - Next representations
  source:
    title: mHC paper
    url: https://arxiv.org/abs/2512.24880
  rule:
    field: residual_mechanism
    equals: mhc
  scope: Explicit manifold-constrained residual mechanism.
  aliases:
  - Manifold-constrained hyper-connections
  catalog: requested
index-sharing:
  reviewed: false
  title: Shared attention index selections
  short: IndexShare
  category: Attention
  summary: Several attention layers reuse one layer's position selection instead of each running its own selector.
  mechanism: A producer layer runs the indexer and picks positions; consumer layers attend over the same positions with their
    own queries, keys and values. The keys and values are not shared.
  memory: 'Sharing selections saves indexer work, not cache: each layer still caches its own keys and values.'
  verify: Read the per-layer modes or the full source mapping in config.json.
  flow:
  - Index producer
  - Shared selections
  - Attention consumers
  source:
    title: Mistral primary model files
    url: https://huggingface.co/mistralai/Mistral-Large-4-1T-A52B
  rule:
    field: index_sharing
    nonempty: true
  scope: Configured index reuse; unknown producer mappings remain unknown.
  aliases:
  - Index sharing
  catalog: requested
gated-residuals:
  reviewed: false
  title: Gated residual streams
  short: Gated Residuals
  category: Residual connections
  summary: Learned gates control how much each layer reads from and writes to the residual streams.
  mechanism: A read gate weights the streams a layer takes as input; a write gate scales the layer's output before it is added
