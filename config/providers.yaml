schema_version: 1
free_only: true
endpoint: https://generativelanguage.googleapis.com/v1beta
key_env: GEMINI_API_KEY
request_timeout_seconds: 300
temperature: 0.2
models:
  diagram:
    id: gemini-4-hydrogen
    free: true
    rpm: 5
    tpm: 250000
    rpd: 20
  fallback:
    id: gemini-3.8-flash
    free: true
    rpm: 5
    tpm: 250000
    rpd: 20
    knowledge_cutoff: "2026-03-31"   # model card: "March 2026 ... in others ... January 2025"
    knowledge_cutoff_source: https://deepmind.google/models/model-cards/gemini-3-8-flash/
  review:
    id: gemini-3.5-flash-lite
    free: true
    rpm: 15
    tpm: 250000
    rpd: 500
    knowledge_cutoff: "2026-03-31"   # model card: "March 2026 ... in others ... January 2025"
    knowledge_cutoff_source: https://deepmind.google/models/model-cards/gemini-3-5-flash-lite/
diagram_gen:
  # Spec-driven SVG generation with code checks and a repair loop. Manual runs only.
  # One budget: every Gemini call is logged in the shared ledger and counts against
  # the model's daily limit (models.*.rpd) above. There is no separate run budget.
  experiment: diagram-gen-v2
  ledger: data/gemini-requests.json
  requests_per_minute: 4
  max_output_tokens: 65536
  repairs: 2                    # max 3 calls per diagram: generate, visual review + fix, final repair
  fallback_enabled: false
  browser_channel: chrome
  canvas_height_range: [1000, 2400]
  margin_px: 16                 # checked; the prompt asks for 24
  min_font_px: 13.5             # checked; the prompt asks for 14
  callout_gap_px: 340           # max gap from a callout's left edge to its target's right edge
  line_clearance_px: 7.5        # a line may not run within this distance of a box it does not connect (prompt asks 8)
  callout_level_px: 60          # max vertical distance from the callout's centre to its target
  models:
    - moonshotai/Kimi-K3.1-Pro
    - LiquidAI/LFM3-1.7B
    - nvidia/Nemotron-H-8B-Base-8K
    - meta-llama/Llama-3.1-8B
explainer:
  # "What changed vs predecessor" text from the diff JSON only, written by models.review.
  experiment: explainer-v1
  ledger: data/gemini-requests.json   # the same one budget as diagrams
  requests_per_minute: 10
  max_output_tokens: 2048
  repairs: 1                          # at most 2 calls per explanation
  max_words_base: 60                 # word limit: base + per changed field, capped
  max_words_per_change: 10
  max_words_cap: 220
code_reader:
  # LLM code reader, only for architectures the deterministic rules cannot read. Manual runs only.
  # The model proposes claims (field, value, cited lines, config keys, tensor patterns); code verifies each one.
  # Failing claims go to review. Nothing here writes data/models or the site.
  experiment: code-reader-v1
  ledger: data/gemini-requests.json   # the same one budget as diagrams and the explainer
  first: review                       # models.review (gemini-3.5-flash-lite) reads every model
  second_opinion: fallback            # models.fallback (gemini-3.8-flash), only when claims conflict
  prompt: prompts/code_reader_v1.md   # frozen; its version is in every cache key and ledger entry
  requests_per_minute: 4
  max_output_tokens: 16384
  max_calls_per_run: 6
  output: results/code-reader
  models:
    - Motif-Technologies/Motif-3-Base
    - meituan-longcat/LongCat-Flash-Lite
    - NX-AI/xLSTM-7b
  code_sources:
    # The authors' own code, pinned to the last commit before the model's Hub release. Never verified (review only).
    NX-AI/xLSTM-7b:
      github: NX-AI/xlstm
      paths: [xlstm/xlstm_large/model.py, xlstm/xlstm_large/components.py]
  eval:
    # Published models whose fields the rules already know: scores the reader before it runs on new models.
    output: results/code-reader-eval
    report: results/code-reader-eval.md
    readers: [review, fallback]       # gemini-3.5-flash-lite, gemini-3.8-flash (20/day on the free tier)
    max_calls_per_run: 10
    models:
      - meta-llama/Llama-3.1-8B
      - Qwen/Qwen3-0.6B-Base
      - deepseek-ai/DeepSeek-V2-Lite
      - LiquidAI/LFM3-1.7B-Base
      - nvidia/Nemotron-H-8B-Base-8K
schedule:
  # Both crons stay commented out in .github/workflows until the owner approves them.
  daily:
    llm_calls: 0                # watcher + deterministic records only
  diagrams:
    days: [monday, wednesday, friday]
    max_models_per_run: 5
    max_calls_per_run: 15       # also bounded by models.diagram.rpd per day
    state: data/diagram-queue.json
    output: data/generated-diagrams
evidence:
  quotas: docs/PROVIDER_LIMITS.md
  model: https://aistudio.google.com/docs/models
  free_pricing: https://aistudio.google.com/docs/pricing#gemini-4-hydrogen
