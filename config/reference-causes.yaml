# Cause of each disagreement in results/reference-agreement.md (reference commit pinned in
# config/reference-gallery.yaml). cause: definition | error-ours | error-reference | unresolved.
# Recorded after checking each model's own card, config and tensor headers. Comparison only:
# nothing here changes a published field.
LiquidAI/LFM3-1.7B:
  kv_cache_per_token_bf16:
    cause: definition
    why: >-
      Ours is the growing cache per token (sliding-window and constant states excluded): 6 global layers x
      4 KV heads x 128 x 2 (K, V) x 2 B = 12,288 B. The reference counts all 11 attention layers including the
      5 sliding-window ones: 11 x 2,048 B = 22,528 B = 22 KiB. Both are arithmetic on the same config.
Qwen/Qwen3.8-Flash-Next:
  params_active:
    cause: definition
    why: >-
      The card states "125B with 6B activated, plus 51B n-gram embedding and 4B MTP". Our active convention
      counts every non-expert weight, including the n-gram embedding tables and the MTP layer; the reference
      follows the card's 6B core figure.
deepseek-ai/DeepSeek-V4.1-Flash:
  params_total:
    cause: definition
    why: >-
      The card states 552B backbone plus 196B Engram memory (748B). Ours is every stored tensor: 763.2B
      including 14.2B of MTP modules and a 0.4B vision tower; without those it is 748.6B, which matches.
  params_active:
    cause: definition
    why: >-
      The card states 8B active in prefill and 16B in decode. Our active convention counts all non-expert
      weights, including the 196B Engram memory that the card describes as sparsely accessed by lookup.
nvidia/NVIDIA-Nemotron-Labs-Dory1.0-4B-BF16:
  num_layers:
    cause: definition
    why: >-
      config.json lists 72 layer entries that alternate attention and MLP (16 input + 40 recurrent + 16
      output), and the weights hold layer indices 0-71; our count is per operator. The reference counts
      attention+MLP blocks: 8 input + 20 recurrent + 8 output = 36, i.e. the same 72 operators.
zai-org/GLM-5.2:
  params_total:
    cause: unresolved
    why: >-
      Ours is the exact tensor-header sum (753.3B over 78 stored layers, indices 0-77; no separate MTP
      tensors). The reference's 744B is not stated in this repository's card or config, so the 9.3B gap
      (about one MoE layer) cannot be attributed from primary sources yet.
  params_active:
    cause: definition
    why: >-
      Ours (41.8B) includes the input embedding and output head (0.95B each); without them it is 39.9B,
      matching the reference's 40B within its rounding.
