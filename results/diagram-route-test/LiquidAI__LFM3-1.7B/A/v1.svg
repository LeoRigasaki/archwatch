    <text data-label-id="f_num_layers" class="label-fact" x="480" y="562">num_layers: 24</text>
    <text data-label-id="f_context_length" class="label-fact" x="480" y="588">context_length: 262144</text>
    <text data-label-id="f_params_total" class="label-fact" x="480" y="614">params_total: 1728801536</text>
  </g>
