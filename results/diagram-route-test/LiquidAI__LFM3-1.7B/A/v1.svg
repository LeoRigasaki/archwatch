    <text data-label-id="count_short_conv" class="label-fact" x="180" y="272">layers: 13</text>
    <text data-label-id="f_short_conv_kernel" class="label-fact" x="180" y="298">short_conv_kernel: 7</text>
  </g>

  <g data-node-id="mix_full_attention">
    <rect class="mixer-rect" x="350" y="190" width="260" height="160"/>
    <text data-label-id="kind_full_attention" class="label-kind" x="480" y="218">Global attention</text>
    <text data-label-id="count_full_attention" class="label-fact" x="480" y="248">layers: 6</text>
    <text data-label-id="f_num_attention_heads" class="label-fact" x="480" y="274">num_attention_heads: 16</text>
    <text data-label-id="f_num_kv_heads" class="label-fact" x="480" y="300">num_kv_heads: 4</text>
    <text data-label-id="f_head_dim" class="label-fact" x="480" y="326">head_dim: 128</text>
