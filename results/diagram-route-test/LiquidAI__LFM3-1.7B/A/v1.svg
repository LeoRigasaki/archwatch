    <text data-label-id="count_sliding_attention" class="label-fact" x="780" y="272">layers: 5</text>
    <text data-label-id="f_sliding_window" class="label-fact" x="780" y="298">sliding_window: 256</text>
  </g>

  <g data-node-id="ffn">
