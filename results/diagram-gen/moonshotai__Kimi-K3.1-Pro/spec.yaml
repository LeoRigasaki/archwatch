model:
  name: Kimi-K3.1-Pro
  title_label: Kimi-K3.1-Pro (2.8T)
  summary_line: 2.78T parameters, 104B active, 93 layers, 1M context
  total_params: 2.78T
  active_params_per_token: 104B
  layers: 93
  hidden_size: 7168
  vocabulary: 163,840 (160K)
  context_length: 1M tokens (1,048,576)
  modality: text + image (vision encoder not shown in the main diagram)
layer_pattern:
  summary: 69 KDA + 24 Gated DSA layers
  rule: Every 4th layer is Gated DSA (layers 4, 8, 12 ... 92), and layer 93 is also Gated DSA. All other layers are KDA.
  compressed_view:
  - repeat: 1
    layers:
    - KDA + dense FFN
    - KDA + LatentMoE
    - KDA + LatentMoE
    - Gated DSA + LatentMoE
    note: layers 1-4
  - repeat: 22
    layers:
    - KDA + LatentMoE
    - KDA + LatentMoE
    - KDA + LatentMoE
    - Gated DSA + LatentMoE
    note: layers 5-92
  - repeat: 1
    layers:
    - Gated DSA + LatentMoE
    note: layer 93
io:
  bottom:
  - id: text
    label: Tokenized text
  - id: embedding
    label: Token embedding 163,840 x 7168
  top:
  - id: final_res
    label: Final AttnRes mix
  - id: final_norm
    label: Final norm
  - id: lm_head
    label: LM head 7168 -> 163,840
  note: LM head is not tied to the embedding
  vision: 27-layer vision encoder (401M) + projector (46M) feeds image tokens into the embedding sequence
