  - res2 -> out
  caption:
  - learned residual-mixing weights (self_attention_res_proj, mlp_res_proj); config attn_res_block_size = 12
  - 'dense FFN: layer 1; LatentMoE: layers 2-93'
zoom_panels:
  kda:
    title: Kimi Delta Attention (KDA), 69 layers
    nodes:
    - id: in
      label: input (7168)
    - id: out
      label: output (7168)
    - id: qkv
      label: 'q, k, v: Linear 7168 -> 12288'
    - id: conv
      label: Conv1d, kernel 4
    - id: delta
      label: gated delta rule
    - id: beta
      label: 'beta: Linear 7168 -> 96'
    - id: decay
      label: 'decay: Linear 7168 -> 128 -> 12288'
    - id: onorm
      label: output norm (128)
    - id: mul
      label: multiply
    - id: oproj
      label: 'output projection: 12288 -> 7168'
    - id: gate
      label: 'output gate: Linear 7168 -> 12288'
    edges:
    - in -> qkv
    - qkv -> conv
    - conv -> delta
    - in -> beta
    - beta -> delta
    - in -> decay
    - decay -> delta
    - delta -> onorm
    - onorm -> mul
    - mul -> oproj
    - oproj -> out
    - in -> gate
    - gate -> mul
    caption:
    - 96 heads x 128 dims
    - short depthwise Conv1d on q, k and v separately
    - 'beta: one per head'
    - decay gate is low-rank
    - fixed 128 x 128 state per head; cache does not grow with context
  gated_dsa:
    title: Gated DeepSeek Sparse Attention (DSA), 24 layers
    nodes:
    - id: in
      label: input (7168)
    - id: out
      label: output (7168)
    - id: attn
      label: sparse attention, NoPE
    - id: qa
      label: 'q: Linear 7168 -> 1536, norm'
    - id: qb
      label: Linear 1536 -> 96 x 192
    - id: kva
      label: 'kv: Linear 7168 -> 576'
    - id: kvnorm
      label: norm on 512 latent
    - id: kvb
      label: Linear 512 -> 96 x (128 + 128)
    - id: indexer
      label: 'indexer: 32 heads x 128'
    - id: topk
      label: select top 2048 tokens
    - id: mul
      label: multiply
    - id: oproj
      label: 'output projection: 12288 -> 7168'
    - id: gate
      label: 'output gate: Linear 7168 -> 12288'
    edges:
    - in -> qa
    - qa -> qb
    - qb -> attn
    - in -> kva
    - kva -> kvnorm
    - kvnorm -> kvb
    - kvb -> attn
    - kva -> attn
    - qa -> indexer
    - in -> indexer
    - indexer -> topk
    - topk -> attn
    - attn -> mul
    - mul -> oproj
    - oproj -> out
    - in -> gate
    - gate -> mul
    caption:
    - 'indexer: query from the 1536 latent, key Linear 7168 -> 128 with norm, per-head weights Linear 7168 -> 32'
    - indexer picks the top 2048 tokens; attention runs only on those
    - 96 heads; query/key 192 = 128 + 64, value 128
    - 'kv: 576 = 512 latent + 64 key dims; the 64 key dims skip the latent norm'
    - 'position encoding: NoPE (config mla_use_nope = true)'
    - 'cache per token: 576 MLA values + 128 indexer key values per layer'
