      label: 'in_proj: Linear 4096 -> 18560'
    - id: scan
      label: 'scan: 128 heads x 64'
    - id: conv
      label: Conv1d kernel 4 (10240 channels)
    - id: norm
      label: norm (8192) gated by z
    - id: out_proj
      label: 'out_proj: Linear 8192 -> 4096'
    edges:
    - in -> in_proj
    - in_proj -> conv
    - conv -> scan
    - in_proj -> scan
    - in_proj -> norm
    - scan -> norm
    - norm -> out_proj
    - out_proj -> out
    caption:
    - in_proj splits into z (8192), x (8192), B and C (8 groups x 128 each) and dt (128)
