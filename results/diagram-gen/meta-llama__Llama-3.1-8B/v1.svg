<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1230">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#333333"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #1F2937; }
      .title { font-size: 34px; font-weight: 700; text-anchor: middle; }
      .summary { font-size: 16px; fill: #4B5563; text-anchor: middle; }
      .panel-title { font-size: 18px; font-weight: 700; }
      .box-label { font-size: 14px; text-anchor: middle; dominant-baseline: central; }
      .bar-label { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .repeat-label { font-size: 16px; font-weight: 700; fill: #374151; dominant-baseline: central; }
      .note-text { font-size: 14px; fill: #6B7280; }
      .caption { font-size: 14px; fill: #6B7280; }
      .callout { font-size: 15px; font-weight: 700; fill: #1F2937; }
      .edge { fill: none; stroke: #333333; stroke-width: 1.6; }
      .node-box { fill: #FFFFFF; stroke: #4B5563; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1480" height="1230" fill="#FFFFFF"/>

  <g data-section="title">
    <text x="740" y="62" class="title">Llama-3.1-8B</text>
    <text x="740" y="94" class="summary">8.03B parameters, 32 layers, 128K context</text>
  </g>

  <g data-section="stack">
    <rect x="24" y="130" width="756" height="506" rx="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>

    <line x1="194" y1="180" x2="194" y2="146" class="edge" marker-end="url(#arrow)"/>

    <g data-io="lm_head">
      <rect x="44" y="180" width="300" height="46" rx="8" class="node-box"/>
      <text x="194" y="203" class="box-label">LM head 4096 -&gt; 128,256</text>
    </g>
    <text x="364" y="198" class="note-text">LM head is not tied
      <tspan x="364" dy="18">to the embedding</tspan>
    </text>

    <line x1="194" y1="258" x2="194" y2="226" class="edge" marker-end="url(#arrow)"/>

    <g data-io="final_norm">
      <rect x="44" y="258" width="300" height="46" rx="8" class="node-box"/>
      <text x="194" y="281" class="box-label">Final norm</text>
    </g>

    <line x1="194" y1="336" x2="194" y2="304" class="edge" marker-end="url(#arrow)"/>

    <g data-group="1" data-repeat="32">
      <rect x="36" y="336" width="316" height="106" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
      <rect data-layer="GQA + FFN" x="46" y="372" width="296" height="34" rx="6" fill="#F4A8A4" stroke="#B84742" stroke-width="1.2"/>
      <text x="194" y="389" class="bar-label">GQA + FFN</text>
      <text x="368" y="389" class="repeat-label">32 x</text>
    </g>

    <path d="M 418 336 C 430 336 430 344 430 356 L 430 377 C 430 385 438 389 444 389 C 438 389 430 393 430 401 L 430 422 C 430 434 430 442 418 442" fill="none" stroke="#4B5563" stroke-width="1.8"/>
    <text x="452" y="389" class="repeat-label">32 layers</text>

    <line x1="194" y1="476" x2="194" y2="442" class="edge" marker-end="url(#arrow)"/>

    <g data-io="embedding">
      <rect x="44" y="476" width="300" height="58" rx="8" class="node-box"/>
      <text x="194" y="505" class="box-label">Token embedding 128,256 x 4096</text>
    </g>

    <line x1="194" y1="566" x2="194" y2="534" class="edge" marker-end="url(#arrow)"/>

    <g data-io="text">
      <rect x="44" y="566" width="300" height="46" rx="8" class="node-box"/>
      <text x="194" y="589" class="box-label">Tokenized text</text>
    </g>

    <g data-callout="1">
      <text x="564" y="340" class="callout">Context length:
        <tspan x="564" dy="18">128K tokens</tspan>
      </text>
    </g>
    <g data-callout="2">
      <text x="564" y="389" class="callout">32 Q / 8 KV heads</text>
    </g>
    <g data-callout="5">
      <text x="564" y="416" class="callout">KV cache: 128 KB
        <tspan x="564" dy="18">per token</tspan>
      </text>
    </g>
    <g data-callout="3">
      <text x="564" y="492" class="callout">Vocabulary: 128,256</text>
    </g>
    <g data-callout="4">
      <text x="564" y="518" class="callout">Embedding dimension:
        <tspan x="564" dy="18">4096</tspan>
      </text>
    </g>
  </g>

  <g data-section="each-layer">
    <rect x="24" y="660" width="756" height="540" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="44" y="692" class="panel-title">Each layer</text>

    <g data-node="out">
      <rect x="442" y="708" width="160" height="34" rx="8" class="node-box"/>
      <text x="522" y="725" class="box-label">layer output</text>
    </g>
    <g data-node="res2">
      <rect x="442" y="770" width="160" height="34" rx="8" class="node-box"/>
      <text x="522" y="787" class="box-label">residual add</text>
    </g>
    <g data-node="ffn">
      <rect x="222" y="832" width="140" height="34" rx="8" class="node-box"/>
      <text x="292" y="849" class="box-label">FFN</text>
    </g>
    <g data-node="pre_ffn_norm">
      <rect x="202" y="894" width="180" height="34" rx="8" class="node-box"/>
      <text x="292" y="911" class="box-label">norm (pre-FFN)</text>
    </g>
    <g data-node="res1">
      <rect x="442" y="956" width="160" height="34" rx="8" class="node-box"/>
      <text x="522" y="973" class="box-label">residual add</text>
    </g>
    <g data-node="mixer">
      <rect x="202" y="1018" width="180" height="34" rx="8" class="node-box"/>
      <text x="292" y="1035" class="box-label">token mixer: GQA</text>
    </g>
    <g data-node="pre_mixer_norm">
      <rect x="202" y="1080" width="180" height="34" rx="8" class="node-box"/>
      <text x="292" y="1097" class="box-label">norm (pre-mixer)</text>
    </g>
    <g data-node="in">
      <rect x="442" y="1142" width="160" height="34" rx="8" class="node-box"/>
      <text x="522" y="1159" class="box-label">layer input</text>
    </g>

    <polyline data-edge="in-&gt;pre_mixer_norm" points="442,1159 292,1159 292,1114" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="pre_mixer_norm-&gt;mixer" x1="292" y1="1080" x2="292" y2="1052" class="edge" marker-end="url(#arrow)"/>
    <polyline data-edge="mixer-&gt;res1" points="292,1018 292,973 442,973" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="in-&gt;res1" x1="562" y1="1142" x2="562" y2="990" class="edge" marker-end="url(#arrow)"/>
    <polyline data-edge="res1-&gt;pre_ffn_norm" points="482,956 482,942 292,942 292,928" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="pre_ffn_norm-&gt;ffn" x1="292" y1="894" x2="292" y2="866" class="edge" marker-end="url(#arrow)"/>
    <polyline data-edge="ffn-&gt;res2" points="292,832 292,787 442,787" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="res1-&gt;res2" x1="562" y1="956" x2="562" y2="804" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="res2-&gt;out" x1="522" y1="770" x2="522" y2="742" class="edge" marker-end="url(#arrow)"/>
  </g>

  <g data-section="zooms">
    <g data-zoom="gqa">
      <rect x="810" y="130" width="640" height="504" rx="10" fill="#FFFFFF" stroke="#B84742" stroke-width="2" stroke-dasharray="6,5"/>
      <text x="830" y="160" class="panel-title" style="fill: #B84742;">GQA attention (32 layers)</text>

      <g data-node="out">
        <rect x="1050" y="184" width="160" height="36" rx="8" class="node-box"/>
        <text x="1130" y="202" class="box-label">output (4096)</text>
      </g>
      <g data-node="oproj">
        <rect x="983" y="252" width="294" height="36" rx="8" class="node-box"/>
        <text x="1130" y="270" class="box-label">output projection: 4096 -&gt; 4096</text>
      </g>
      <g data-node="attn">
        <rect x="995" y="320" width="270" height="36" rx="8" class="node-box"/>
        <text x="1130" y="338" class="box-label">attention: 32 q / 8 kv heads</text>
      </g>
      <g data-node="rotary">
        <rect x="936" y="388" width="176" height="36" rx="8" class="node-box"/>
        <text x="1024" y="406" class="box-label">rotary on q and k</text>
      </g>
      <g data-node="q">
        <rect x="824" y="456" width="188" height="36" rx="8" class="node-box"/>
        <text x="918" y="474" class="box-label">q: Linear 4096 -&gt; 4096</text>
      </g>
      <g data-node="k">
        <rect x="1036" y="456" width="188" height="36" rx="8" class="node-box"/>
        <text x="1130" y="474" class="box-label">k: Linear 4096 -&gt; 1024</text>
      </g>
      <g data-node="v">
        <rect x="1248" y="456" width="188" height="36" rx="8" class="node-box"/>
        <text x="1342" y="474" class="box-label">v: Linear 4096 -&gt; 1024</text>
      </g>
      <g data-node="in">
        <rect x="1050" y="524" width="160" height="36" rx="8" class="node-box"/>
        <text x="1130" y="542" class="box-label">input (4096)</text>
      </g>

      <polyline data-edge="in-&gt;q" points="1080,524 1080,508 918,508 918,492" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="in-&gt;k" x1="1130" y1="524" x2="1130" y2="492" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="in-&gt;v" points="1180,524 1180,508 1342,508 1342,492" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="q-&gt;rotary" x1="960" y1="456" x2="960" y2="424" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="k-&gt;rotary" x1="1084" y1="456" x2="1084" y2="424" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="rotary-&gt;attn" x1="1040" y1="388" x2="1040" y2="356" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="v-&gt;attn" points="1342,456 1342,372 1230,372 1230,356" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="attn-&gt;oproj" x1="1130" y1="320" x2="1130" y2="288" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="oproj-&gt;out" x1="1130" y1="252" x2="1130" y2="220" class="edge" marker-end="url(#arrow)"/>

      <text x="830" y="594" class="caption">32 query heads, 8 key/value heads, head size 128
        <tspan x="830" dy="20">rotary position encoding, theta 500,000 (llama3 scaling, factor 8)</tspan>
      </text>
    </g>

    <g data-zoom="ffn">
      <rect x="810" y="664" width="640" height="456" rx="10" fill="#FFFFFF" stroke="#5A6270" stroke-width="2" stroke-dasharray="6,5"/>
      <text x="830" y="694" class="panel-title" style="fill: #5A6270;">SwiGLU FFN</text>

      <g data-node="out">
        <rect x="1050" y="718" width="160" height="36" rx="8" class="node-box"/>
        <text x="1130" y="736" class="box-label">output (4096)</text>
      </g>
      <g data-node="down">
        <rect x="1007" y="786" width="246" height="36" rx="8" class="node-box"/>
        <text x="1130" y="804" class="box-label">down: Linear 14336 -&gt; 4096</text>
      </g>
      <g data-node="mul">
        <rect x="1070" y="854" width="120" height="36" rx="8" class="node-box"/>
        <text x="1130" y="872" class="box-label">multiply</text>
      </g>
      <g data-node="act">
        <rect x="930" y="922" width="100" height="36" rx="8" class="node-box"/>
        <text x="980" y="940" class="box-label">SiLU</text>
      </g>
      <g data-node="gate">
        <rect x="857" y="990" width="246" height="36" rx="8" class="node-box"/>
        <text x="980" y="1008" class="box-label">gate: Linear 4096 -&gt; 14336</text>
      </g>
      <g data-node="up">
        <rect x="1165" y="990" width="230" height="36" rx="8" class="node-box"/>
        <text x="1280" y="1008" class="box-label">up: Linear 4096 -&gt; 14336</text>
      </g>
      <g data-node="in">
        <rect x="1050" y="1058" width="160" height="36" rx="8" class="node-box"/>
        <text x="1130" y="1076" class="box-label">input (4096)</text>
      </g>

      <polyline data-edge="in-&gt;gate" points="1080,1058 1080,1042 980,1042 980,1026" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="in-&gt;up" points="1180,1058 1180,1042 1280,1042 1280,1026" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="gate-&gt;act" x1="980" y1="990" x2="980" y2="958" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="act-&gt;mul" points="980,922 980,906 1100,906 1100,890" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="up-&gt;mul" points="1280,990 1280,906 1160,906 1160,890" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="mul-&gt;down" x1="1130" y1="854" x2="1130" y2="822" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="down-&gt;out" x1="1130" y1="786" x2="1130" y2="754" class="edge" marker-end="url(#arrow)"/>
    </g>
  </g>
</svg>