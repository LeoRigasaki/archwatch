<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1640">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#333333"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #1F2937; }
      .title { font-size: 34px; font-weight: 700; text-anchor: middle; }
      .summary { font-size: 16px; fill: #4B5563; text-anchor: middle; }
      .panel-title { font-size: 18px; font-weight: 700; }
      .box-label { font-size: 14px; text-anchor: middle; dominant-baseline: central; }
      .bar-label { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .repeat-label { font-size: 16px; font-weight: 700; fill: #374151; dominant-baseline: central; }
      .caption { font-size: 14px; fill: #6B7280; }
      .callout { font-size: 15px; font-weight: 700; fill: #1F2937; }
      .edge { fill: none; stroke: #333333; stroke-width: 1.6; }
      .node-box { fill: #FFFFFF; stroke: #4B5563; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1480" height="1640" fill="#FFFFFF"/>

  <g data-section="title">
    <text x="740" y="62" class="title">DeepSeek-V2-Lite (15.7B)</text>
    <text x="740" y="94" class="summary">16B parameters, 2.45B active, 27 layers, 160K context</text>
  </g>

  <g data-section="stack">
    <rect x="24" y="130" width="756" height="712" rx="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>

    <line x1="214" y1="188" x2="214" y2="150" class="edge" marker-end="url(#arrow)"/>

    <g data-io="lm_head">
      <rect x="44" y="188" width="340" height="44" rx="8" class="node-box"/>
      <text x="214" y="210" class="box-label">LM head 2048 -&gt; 102,400</text>
    </g>
    <text x="402" y="204" class="caption">LM head is not tied
      <tspan x="402" dy="18">to the embedding</tspan>
    </text>

    <line x1="214" y1="276" x2="214" y2="232" class="edge" marker-end="url(#arrow)"/>

    <g data-io="final_norm">
      <rect x="44" y="276" width="340" height="44" rx="8" class="node-box"/>
      <text x="214" y="298" class="box-label">Final norm</text>
    </g>

    <line x1="214" y1="376" x2="214" y2="320" class="edge" marker-end="url(#arrow)"/>

    <g data-group="2" data-repeat="26">
      <rect x="34" y="376" width="360" height="66" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
      <rect data-layer="MLA + MoE" x="44" y="392" width="340" height="34" rx="5" fill="#F4A8A4" stroke="#B84742" stroke-width="1.2"/>
      <text x="214" y="409" class="bar-label">MLA + MoE</text>
      <text x="404" y="409" class="repeat-label">26 x</text>
    </g>

    <line x1="214" y1="512" x2="214" y2="442" class="edge" marker-end="url(#arrow)"/>

    <g data-group="1" data-repeat="1">
      <rect x="34" y="512" width="360" height="66" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
      <rect data-layer="MLA + dense FFN" x="44" y="528" width="340" height="34" rx="5" fill="#F4A8A4" stroke="#B84742" stroke-width="1.2"/>
      <text x="214" y="545" class="bar-label">MLA + dense FFN</text>
      <text x="404" y="545" class="repeat-label">1 x</text>
    </g>

    <path d="M 442 376 C 452 376 452 386 452 398 L 452 465 C 452 473 458 477 464 477 C 458 477 452 481 452 489 L 452 556 C 452 568 452 578 442 578" fill="none" stroke="#4B5563" stroke-width="1.8"/>
    <text x="470" y="477" class="repeat-label">27 layers</text>

    <line x1="214" y1="654" x2="214" y2="578" class="edge" marker-end="url(#arrow)"/>

    <g data-io="embedding">
      <rect x="44" y="654" width="340" height="44" rx="8" class="node-box"/>
      <text x="214" y="676" class="box-label">Token embedding 102,400 x 2048</text>
    </g>

    <line x1="214" y1="754" x2="214" y2="698" class="edge" marker-end="url(#arrow)"/>

    <g data-io="text">
      <rect x="44" y="754" width="340" height="44" rx="8" class="node-box"/>
      <text x="214" y="776" class="box-label">Tokenized text</text>
    </g>

    <g data-callout="3">
      <text x="560" y="402" class="callout">64 experts, 6 active +
        <tspan x="560" dy="20">2 shared</tspan>
      </text>
    </g>
    <g data-callout="1">
      <text x="560" y="468" class="callout">Context length: 160K
        <tspan x="560" dy="20">tokens</tspan>
      </text>
    </g>
    <g data-callout="2">
      <text x="560" y="518" class="callout">Layer 1 dense FFN;
        <tspan x="560" dy="20">layers 2-27 MoE</tspan>
      </text>
    </g>
    <g data-callout="5">
      <text x="560" y="564" class="callout">KV cache: 30.4 KB per
        <tspan x="560" dy="20">token (vs 270 KB for</tspan>
        <tspan x="560" dy="20">plain multi-head</tspan>
        <tspan x="560" dy="20">attention)</tspan>
      </text>
    </g>
    <g data-callout="4">
      <text x="560" y="676" class="callout" style="dominant-baseline: central;">Vocabulary: 100K</text>
    </g>
  </g>

  <g data-section="each-layer">
    <rect x="24" y="868" width="756" height="744" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="44" y="902" class="panel-title">Each layer</text>

    <g data-node="out">
      <rect x="440" y="930" width="160" height="40" rx="8" class="node-box"/>
      <text x="520" y="950" class="box-label">layer output</text>
    </g>
    <g data-node="res2">
      <rect x="440" y="1010" width="160" height="40" rx="8" class="node-box"/>
      <text x="520" y="1030" class="box-label">residual add</text>
    </g>
    <g data-node="ffn">
      <rect x="135" y="1090" width="210" height="40" rx="8" class="node-box"/>
      <text x="240" y="1110" class="box-label">FFN: dense FFN or MoE</text>
    </g>
    <g data-node="pre_ffn_norm">
      <rect x="155" y="1170" width="170" height="40" rx="8" class="node-box"/>
      <text x="240" y="1190" class="box-label">norm (pre-FFN)</text>
    </g>
    <g data-node="res1">
      <rect x="440" y="1250" width="160" height="40" rx="8" class="node-box"/>
      <text x="520" y="1270" class="box-label">residual add</text>
    </g>
    <g data-node="mixer">
      <rect x="150" y="1330" width="180" height="40" rx="8" class="node-box"/>
      <text x="240" y="1350" class="box-label">token mixer: MLA</text>
    </g>
    <g data-node="pre_mixer_norm">
      <rect x="150" y="1410" width="180" height="40" rx="8" class="node-box"/>
      <text x="240" y="1430" class="box-label">norm (pre-mixer)</text>
    </g>
    <g data-node="in">
      <rect x="440" y="1498" width="160" height="40" rx="8" class="node-box"/>
      <text x="520" y="1518" class="box-label">layer input</text>
    </g>

    <polyline data-edge="in->pre_mixer_norm" points="440,1518 240,1518 240,1450" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="pre_mixer_norm->mixer" x1="240" y1="1410" x2="240" y2="1370" class="edge" marker-end="url(#arrow)"/>
    <polyline data-edge="mixer->res1" points="240,1330 240,1270 440,1270" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="in->res1" x1="520" y1="1498" x2="520" y2="1290" class="edge" marker-end="url(#arrow)"/>
    <polyline data-edge="res1->pre_ffn_norm" points="480,1250 480,1230 240,1230 240,1210" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="pre_ffn_norm->ffn" x1="240" y1="1170" x2="240" y2="1130" class="edge" marker-end="url(#arrow)"/>
    <polyline data-edge="ffn->res2" points="240,1090 240,1030 440,1030" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="res1->res2" x1="520" y1="1250" x2="520" y2="1050" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="res2->out" x1="520" y1="1010" x2="520" y2="970" class="edge" marker-end="url(#arrow)"/>

    <text x="44" y="1584" class="caption">dense FFN: layer 1; MoE: layers 2-27</text>
  </g>

  <g data-section="zooms">
    <g data-zoom="mla">
      <rect x="810" y="130" width="640" height="592" rx="10" fill="#FFFFFF" stroke="#B84742" stroke-width="2" stroke-dasharray="6,5"/>
      <text x="830" y="160" class="panel-title" style="fill: #B84742;">Multi-head Latent Attention (MLA), 27 layers</text>

      <g data-node="out">
        <rect x="1055" y="184" width="150" height="36" rx="8" class="node-box"/>
        <text x="1130" y="202" class="box-label">output (2048)</text>
      </g>
      <g data-node="oproj">
        <rect x="984" y="248" width="292" height="36" rx="8" class="node-box"/>
        <text x="1130" y="266" class="box-label">output projection: 2048 -&gt; 2048</text>
      </g>
      <g data-node="attn">
        <rect x="1050" y="312" width="160" height="36" rx="8" class="node-box"/>
        <text x="1130" y="330" class="box-label">attention</text>
      </g>
      <g data-node="kvb">
        <rect x="1100" y="384" width="280" height="36" rx="8" class="node-box"/>
        <text x="1240" y="402" class="box-label">Linear 512 -&gt; 16 x (128 + 128)</text>
      </g>
      <g data-node="kvnorm">
        <rect x="1145" y="448" width="190" height="36" rx="8" class="node-box"/>
        <text x="1240" y="466" class="box-label">norm on 512 latent</text>
      </g>
      <g data-node="q">
        <rect x="830" y="512" width="250" height="36" rx="8" class="node-box"/>
        <text x="955" y="530" class="box-label">q: Linear 2048 -&gt; 16 x 192</text>
      </g>
      <g data-node="kva">
        <rect x="1130" y="512" width="220" height="36" rx="8" class="node-box"/>
        <text x="1240" y="530" class="box-label">kv: Linear 2048 -&gt; 576</text>
      </g>
      <g data-node="in">
        <rect x="1055" y="576" width="150" height="36" rx="8" class="node-box"/>
        <text x="1130" y="594" class="box-label">input (2048)</text>
      </g>

      <polyline data-edge="in->q" points="1090,576 1090,562 955,562 955,548" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="in->kva" points="1170,576 1170,562 1240,562 1240,548" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="q->attn" points="955,512 955,366 1090,366 1090,348" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="kva->kvnorm" x1="1240" y1="512" x2="1240" y2="484" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="kvnorm->kvb" x1="1240" y1="448" x2="1240" y2="420" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="kvb->attn" x1="1170" y1="384" x2="1170" y2="348" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="kva->attn" points="1350,530 1412,530 1412,330 1210,330" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="attn->oproj" x1="1130" y1="312" x2="1130" y2="284" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="oproj->out" x1="1130" y1="248" x2="1130" y2="220" class="edge" marker-end="url(#arrow)"/>

      <text x="830" y="644" class="caption">16 heads; query/key 192 = 128 + 64, value 128
        <tspan x="830" dy="18">kv: 576 = 512 latent + 64 key dims; the 64 key dims skip the latent norm</tspan>
        <tspan x="830" dy="18">rotary position encoding on the 64 decoupled key dims, theta 10,000</tspan>
        <tspan x="830" dy="18">(yarn scaling, factor 40)</tspan>
      </text>
    </g>

    <g data-zoom="dense_ffn">
      <rect x="810" y="746" width="640" height="434" rx="10" fill="#FFFFFF" stroke="#5A6270" stroke-width="2" stroke-dasharray="6,5"/>
      <text x="830" y="776" class="panel-title" style="fill: #5A6270;">Dense FFN (layer 1 only)</text>

      <g data-node="out">
        <rect x="1055" y="798" width="150" height="36" rx="8" class="node-box"/>
        <text x="1130" y="816" class="box-label">output (2048)</text>
      </g>
      <g data-node="down">
        <rect x="1000" y="862" width="260" height="36" rx="8" class="node-box"/>
        <text x="1130" y="880" class="box-label">down: Linear 10944 -&gt; 2048</text>
      </g>
      <g data-node="mul">
        <rect x="1075" y="926" width="110" height="36" rx="8" class="node-box"/>
        <text x="1130" y="944" class="box-label">multiply</text>
      </g>
      <g data-node="act">
        <rect x="930" y="990" width="100" height="36" rx="8" class="node-box"/>
        <text x="980" y="1008" class="box-label">SiLU</text>
      </g>
      <g data-node="gate">
        <rect x="850" y="1054" width="260" height="36" rx="8" class="node-box"/>
        <text x="980" y="1072" class="box-label">gate: Linear 2048 -&gt; 10944</text>
      </g>
      <g data-node="up">
        <rect x="1158" y="1054" width="244" height="36" rx="8" class="node-box"/>
        <text x="1280" y="1072" class="box-label">up: Linear 2048 -&gt; 10944</text>
      </g>
      <g data-node="in">
        <rect x="1055" y="1122" width="150" height="36" rx="8" class="node-box"/>
        <text x="1130" y="1140" class="box-label">input (2048)</text>
      </g>

      <polyline data-edge="in->gate" points="1095,1122 1095,1106 980,1106 980,1090" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="in->up" points="1165,1122 1165,1106 1280,1106 1280,1090" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="gate->act" x1="980" y1="1054" x2="980" y2="1026" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="act->mul" points="980,990 980,976 1105,976 1105,962" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="up->mul" points="1280,1054 1280,976 1155,976 1155,962" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="mul->down" x1="1130" y1="926" x2="1130" y2="898" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="down->out" x1="1130" y1="862" x2="1130" y2="834" class="edge" marker-end="url(#arrow)"/>
    </g>

    <g data-zoom="moe">
      <rect x="810" y="1204" width="640" height="408" rx="10" fill="#FFFFFF" stroke="#5A6270" stroke-width="2" stroke-dasharray="6,5"/>
      <text x="830" y="1234" class="panel-title" style="fill: #5A6270;">MoE FFN (layers 2-27)</text>

      <g data-node="out">
        <rect x="1055" y="1256" width="150" height="36" rx="8" class="node-box"/>
        <text x="1130" y="1274" class="box-label">output (2048)</text>
      </g>
      <g data-node="sum">
        <rect x="1080" y="1320" width="100" height="36" rx="8" class="node-box"/>
        <text x="1130" y="1338" class="box-label">sum</text>
      </g>
      <g data-node="experts">
        <rect x="839" y="1388" width="292" height="36" rx="8" class="node-box"/>
        <text x="985" y="1406" class="box-label">6 experts: 2048 -&gt; 1408 -&gt; 2048</text>
      </g>
      <g data-node="router">
        <rect x="850" y="1452" width="240" height="36" rx="8" class="node-box"/>
        <text x="970" y="1470" class="box-label">router: 64 experts, top 6</text>
      </g>
      <g data-node="shared">
        <rect x="1183" y="1420" width="224" height="36" rx="8" class="node-box"/>
        <text x="1295" y="1438" class="box-label">2 shared experts (2816)</text>
      </g>
      <g data-node="in">
        <rect x="1055" y="1520" width="150" height="36" rx="8" class="node-box"/>
        <text x="1130" y="1538" class="box-label">input (2048)</text>
      </g>

      <polyline data-edge="in->router" points="1080,1520 1080,1504 970,1504 970,1488" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="router->experts" x1="970" y1="1452" x2="970" y2="1424" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="in->experts" x1="1115" y1="1520" x2="1115" y2="1424" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="in->shared" points="1170,1520 1170,1504 1295,1504 1295,1456" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="experts->sum" points="985,1388 985,1372 1105,1372 1105,1356" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="shared->sum" points="1295,1420 1295,1372 1155,1372 1155,1356" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="sum->out" x1="1130" y1="1320" x2="1130" y2="1292" class="edge" marker-end="url(#arrow)"/>

      <text x="830" y="1590" class="caption">shared experts: combined width 2816, every token, full 2048 space</text>
    </g>
  </g>
</svg>