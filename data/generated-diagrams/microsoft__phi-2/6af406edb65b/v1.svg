<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1056">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#333333"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #1F2937; }
      .title { font-size: 34px; font-weight: 700; text-anchor: middle; }
      .summary { font-size: 16px; fill: #4B5563; text-anchor: middle; }
      .panel-title { font-size: 18px; font-weight: 700; }
      .box-label { font-size: 14px; text-anchor: middle; dominant-baseline: central; }
      .bar-label { font-size: 14px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .repeat-label { font-size: 16px; font-weight: 700; fill: #374151; dominant-baseline: central; }
      .caption { font-size: 14px; fill: #6B7280; }
      .callout { font-size: 15px; font-weight: 700; fill: #1F2937; }
      .edge { fill: none; stroke: #333333; stroke-width: 1.6; }
      .node-box { fill: #FFFFFF; stroke: #4B5563; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1480" height="1056" fill="#FFFFFF"/>

  <g data-section="title">
    <text x="740" y="62" class="title">phi-2 (2.8B)</text>
    <text x="740" y="94" class="summary">2.78B parameters, 32 layers, 2K context</text>
  </g>

  <g data-section="stack">
    <rect x="24" y="130" width="756" height="478" rx="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>

    <line x1="224" y1="180" x2="224" y2="146" class="edge" marker-end="url(#arrow)"/>

    <g data-io="lm_head">
      <rect x="48" y="180" width="352" height="44" rx="8" class="node-box"/>
      <text x="224" y="202" class="box-label">LM head 2560 -&gt; 51,200</text>
    </g>
    <text x="416" y="196" class="caption">LM head is not tied <tspan x="416" dy="18">to the embedding</tspan></text>

    <line x1="224" y1="252" x2="224" y2="224" class="edge" marker-end="url(#arrow)"/>

    <g data-io="final_norm">
      <rect x="48" y="252" width="352" height="44" rx="8" class="node-box"/>
      <text x="224" y="274" class="box-label">Final norm</text>
    </g>

    <line x1="224" y1="328" x2="224" y2="296" class="edge" marker-end="url(#arrow)"/>

    <g data-group="1" data-repeat="32">
      <rect x="36" y="328" width="376" height="104" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
      <rect data-layer="MHA + FFN" x="48" y="363" width="352" height="34" rx="5" fill="#F4A8A4" stroke="#B84742" stroke-width="1.2"/>
      <text x="224" y="380" class="bar-label">MHA + FFN</text>
      <text x="424" y="380" class="repeat-label">32 x</text>
    </g>

    <line x1="224" y1="464" x2="224" y2="432" class="edge" marker-end="url(#arrow)"/>

    <g data-io="embedding">
      <rect x="48" y="464" width="352" height="56" rx="8" class="node-box"/>
      <text x="224" y="492" class="box-label">Token embedding 51,200 x 2560</text>
    </g>

    <line x1="224" y1="546" x2="224" y2="520" class="edge" marker-end="url(#arrow)"/>

    <g data-io="text">
      <rect x="48" y="546" width="352" height="44" rx="8" class="node-box"/>
      <text x="224" y="568" class="box-label">Tokenized text</text>
    </g>

    <g data-callout="1">
      <text x="564" y="338" class="callout">Context length: 2K <tspan x="564" dy="18">tokens</tspan></text>
    </g>
    <g data-callout="4">
      <text x="564" y="382" class="callout">KV cache: 320 KB <tspan x="564" dy="18">per token</tspan></text>
    </g>
    <g data-callout="2">
      <text x="564" y="478" class="callout">Vocabulary: 50K</text>
    </g>
    <g data-callout="3">
      <text x="564" y="502" class="callout">Embedding dimension: <tspan x="564" dy="18">2560</tspan></text>
    </g>
  </g>

  <g data-section="each-layer">
    <rect x="24" y="634" width="756" height="394" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="44" y="664" class="panel-title">Each layer</text>

    <g data-node="out">
      <rect x="290" y="684" width="160" height="38" rx="8" class="node-box"/>
      <text x="370" y="703" class="box-label">layer output</text>
    </g>
    <g data-node="add">
      <rect x="250" y="750" width="240" height="38" rx="8" class="node-box"/>
      <text x="370" y="769" class="box-label">add input and both branches</text>
    </g>
    <g data-node="mixer">
      <rect x="190" y="816" width="160" height="38" rx="8" class="node-box"/>
      <text x="270" y="835" class="box-label">attention: MHA</text>
    </g>
    <g data-node="ffn">
      <rect x="410" y="816" width="110" height="38" rx="8" class="node-box"/>
      <text x="465" y="835" class="box-label">FFN</text>
    </g>
    <g data-node="norm">
      <rect x="288" y="882" width="160" height="38" rx="8" class="node-box"/>
      <text x="368" y="901" class="box-label">norm (shared)</text>
    </g>
    <g data-node="in">
      <rect x="290" y="948" width="160" height="38" rx="8" class="node-box"/>
      <text x="370" y="967" class="box-label">layer input</text>
    </g>

    <line data-edge="in->norm" x1="370" y1="948" x2="370" y2="920" class="edge" marker-end="url(#arrow)"/>
    <polyline data-edge="norm->mixer" points="330,882 330,868 270,868 270,854" class="edge" marker-end="url(#arrow)"/>
    <polyline data-edge="norm->ffn" points="406,882 406,868 465,868 465,854" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="mixer->add" x1="270" y1="816" x2="270" y2="788" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="ffn->add" x1="465" y1="816" x2="465" y2="788" class="edge" marker-end="url(#arrow)"/>
    <polyline data-edge="in->add" points="450,967 590,967 590,769 490,769" class="edge" marker-end="url(#arrow)"/>
    <line data-edge="add->out" x1="370" y1="750" x2="370" y2="722" class="edge" marker-end="url(#arrow)"/>

    <text x="44" y="1012" class="caption">parallel block: attention and the FFN both read the same normed input</text>
  </g>

  <g data-section="zooms">
    <g data-zoom="mha">
      <rect x="810" y="130" width="640" height="494" rx="10" fill="#FFFFFF" stroke="#B84742" stroke-width="2" stroke-dasharray="6,5"/>
      <text x="830" y="160" class="panel-title" style="fill: #B84742;">MHA attention (32 layers)</text>

      <g data-node="out">
        <rect x="1055" y="184" width="150" height="36" rx="8" class="node-box"/>
        <text x="1130" y="202" class="box-label">output (2560)</text>
      </g>
      <g data-node="oproj">
        <rect x="990" y="250" width="280" height="36" rx="8" class="node-box"/>
        <text x="1130" y="268" class="box-label">output projection: 2560 -&gt; 2560</text>
      </g>
      <g data-node="attn">
        <rect x="998" y="316" width="264" height="36" rx="8" class="node-box"/>
        <text x="1130" y="334" class="box-label">attention: 32 q / 32 kv heads</text>
      </g>
      <g data-node="rotary">
        <rect x="935" y="382" width="180" height="36" rx="8" class="node-box"/>
        <text x="1025" y="400" class="box-label">rotary on q and k</text>
      </g>
      <g data-node="q">
        <rect x="828" y="448" width="184" height="36" rx="8" class="node-box"/>
        <text x="920" y="466" class="box-label">q: Linear 2560 -&gt; 2560</text>
      </g>
      <g data-node="k">
        <rect x="1038" y="448" width="184" height="36" rx="8" class="node-box"/>
        <text x="1130" y="466" class="box-label">k: Linear 2560 -&gt; 2560</text>
      </g>
      <g data-node="v">
        <rect x="1248" y="448" width="184" height="36" rx="8" class="node-box"/>
        <text x="1340" y="466" class="box-label">v: Linear 2560 -&gt; 2560</text>
      </g>
      <g data-node="in">
        <rect x="1055" y="514" width="150" height="36" rx="8" class="node-box"/>
        <text x="1130" y="532" class="box-label">input (2560)</text>
      </g>

      <polyline data-edge="in->q" points="1085,514 1085,499 920,499 920,484" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="in->k" x1="1130" y1="514" x2="1130" y2="484" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="in->v" points="1175,514 1175,499 1340,499 1340,484" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="q->rotary" points="920,448 920,433 980,433 980,418" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="k->rotary" points="1130,448 1130,433 1070,433 1070,418" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="rotary->attn" x1="1045" y1="382" x2="1045" y2="352" class="edge" marker-end="url(#arrow)"/>
      <polyline data-edge="v->attn" points="1340,448 1340,367 1215,367 1215,352" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="attn->oproj" x1="1130" y1="316" x2="1130" y2="286" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="oproj->out" x1="1130" y1="250" x2="1130" y2="220" class="edge" marker-end="url(#arrow)"/>

      <text x="830" y="584" class="caption">32 query heads, 32 key/value heads, head size 80
        <tspan x="830" dy="20">rotary position encoding on 0.4 of each head, theta 10,000</tspan>
      </text>
    </g>

    <g data-zoom="ffn">
      <rect x="810" y="650" width="640" height="378" rx="10" fill="#FFFFFF" stroke="#5A6270" stroke-width="2" stroke-dasharray="6,5"/>
      <text x="830" y="680" class="panel-title" style="fill: #5A6270;">FFN</text>

      <g data-node="out">
        <rect x="1055" y="704" width="150" height="36" rx="8" class="node-box"/>
        <text x="1130" y="722" class="box-label">output (2560)</text>
      </g>
      <g data-node="down">
        <rect x="1018" y="770" width="224" height="36" rx="8" class="node-box"/>
        <text x="1130" y="788" class="box-label">fc2: Linear 10240 -&gt; 2560</text>
      </g>
      <g data-node="act">
        <rect x="1080" y="836" width="100" height="36" rx="8" class="node-box"/>
        <text x="1130" y="854" class="box-label">GELU</text>
      </g>
      <g data-node="up">
        <rect x="1018" y="902" width="224" height="36" rx="8" class="node-box"/>
        <text x="1130" y="920" class="box-label">fc1: Linear 2560 -&gt; 10240</text>
      </g>
      <g data-node="in">
        <rect x="1055" y="968" width="150" height="36" rx="8" class="node-box"/>
        <text x="1130" y="986" class="box-label">input (2560)</text>
      </g>

      <line data-edge="in->up" x1="1130" y1="968" x2="1130" y2="938" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="up->act" x1="1130" y1="902" x2="1130" y2="872" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="act->down" x1="1130" y1="836" x2="1130" y2="806" class="edge" marker-end="url(#arrow)"/>
      <line data-edge="down->out" x1="1130" y1="770" x2="1130" y2="740" class="edge" marker-end="url(#arrow)"/>
    </g>
  </g>
</svg>