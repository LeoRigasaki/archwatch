# The diagram must use ONLY what is written here. If something is not here, leave it out.

model:
  name: phi-2
  title_label: phi-2 (2.8B)
  summary_line: 2.78B parameters, 32 layers, 2K context
  total_params: 2.78B
  layers: 32
  hidden_size: 2560
  vocabulary: 51,200 (50K)
  context_length: 2K tokens (2,048)
layout:
  canvas_width: 1480
  left_panel:
    x:
    - 24
    - 780
    holds: title-free stack panel with its callout margin, then the Each layer box
  callout_margin_x:
  - 560
  - 770
  zoom_columns:
  - x:
    - 810
    - 1450
    panels:
    - mha
    - ffn
  estimated_right_height: 822
  balance: left column (stack panel + Each layer box) and the tallest zoom column within 25% of each other
layer_pattern:
  summary: 32 MHA layers
  compressed_view:
  - repeat: 32
    layers:
    - MHA + FFN
    note: layers 1-32
io:
  bottom:
  - id: text
    label: Tokenized text
  - id: embedding
    label: Token embedding 51,200 x 2560
  top:
  - id: final_norm
    label: Final norm
  - id: lm_head
    label: LM head 2560 -> 51,200
  note: LM head is not tied to the embedding
each_layer:
  title: Each layer
  nodes:
  - id: in
    label: layer input
  - id: out
    label: layer output
  - id: add
    label: add input and both branches
  - id: norm
    label: norm (shared)
  - id: mixer
    label: 'attention: MHA'
  - id: ffn
    label: FFN
  edges:
  - in -> norm
  - norm -> mixer
  - mixer -> add
  - norm -> ffn
  - ffn -> add
  - in -> add
  - add -> out
  caption:
  - 'parallel block: attention and the FFN both read the same normed input'
zoom_panels:
  mha:
    title: MHA attention (32 layers)
    nodes:
    - id: in
      label: input (2560)
    - id: out
      label: output (2560)
    - id: rotary
      label: rotary on q and k
    - id: attn
      label: 'attention: 32 q / 32 kv heads'
    - id: q
      label: 'q: Linear 2560 -> 2560'
    - id: k
      label: 'k: Linear 2560 -> 2560'
    - id: v
      label: 'v: Linear 2560 -> 2560'
    - id: oproj
      label: 'output projection: 2560 -> 2560'
    edges:
    - in -> q
    - q -> rotary
    - rotary -> attn
    - in -> k
    - k -> rotary
    - in -> v
    - v -> attn
    - attn -> oproj
    - oproj -> out
    caption:
    - 32 query heads, 32 key/value heads, head size 80
    - rotary position encoding on 0.4 of each head, theta 10,000
  ffn:
    title: FFN
    nodes:
    - id: in
      label: input (2560)
    - id: out
      label: output (2560)
    - id: down
      label: 'fc2: Linear 10240 -> 2560'
    - id: up
      label: 'fc1: Linear 2560 -> 10240'
    - id: act
      label: GELU
    edges:
    - in -> up
    - up -> act
    - act -> down
    - down -> out
    caption: []
callouts:
- text: 'Context length: 2K tokens'
  beside: stack
- text: 'Vocabulary: 50K'
  beside: embedding
- text: 'Embedding dimension: 2560'
  beside: embedding
- text: 'KV cache: 320 KB per token'
  beside: bar:MHA + FFN
do_not_include:
- any benchmark scores
- any number not in this file
- logos or watermarks
