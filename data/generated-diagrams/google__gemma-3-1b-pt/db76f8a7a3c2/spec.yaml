layer_pattern:
  summary: 22 Sliding-window MQA + 4 Global MQA layers
  rule: Every 6th layer is Global MQA (layers 6, 12, 18 ... 24). All other layers are Sliding-window MQA.
  compressed_view:
  - repeat: 1
    layers:
    - Sliding-window MQA + FFN
    note: layer 1
  - repeat: 4
    layers:
    - Sliding-window MQA + FFN
    - Sliding-window MQA + FFN
    - Sliding-window MQA + FFN
    - Sliding-window MQA + FFN
    - Global MQA + FFN
    - Sliding-window MQA + FFN
    note: layers 2-25
  - repeat: 1
    layers:
    - Sliding-window MQA + FFN
    note: layer 26
