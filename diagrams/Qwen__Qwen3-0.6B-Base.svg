K-norm</text><text x="330.0" y="474.0" class="q" text-anchor="start">one mixer per layer</text><rect x="360.0" y="612.0" width="240.0" height="30.0" rx="8" class="box"/><text x="480.0" y="631.0" class="b" text-anchor="middle">Norm (pre-mixer)</text><path d="M480.0 406V390" class="edge" marker-end="url(#ar)"/><path d="M480.0 480V438" class="edge" marker-end="url(#ar)"/><path d="M480.0 612V596" class="edge" marker-end="url(#ar)"/><path d="M480.0 280V254" class="edge" marker-end="url(#ar)"/><path d="M480.0 694V644" class="edge" marker-end="url(#ar)"/><rect x="310.0" y="694.0" width="340.0" height="44.0" rx="8" class="box"/><text x="480.0" y="720.5" class="h" text-anchor="middle">Token embedding 151,936 x 1024</text><text x="24.0" y="768.0" class="q" text-anchor="start">Note: No modeling_*.py in the repo: mechanism details (layer internals, residual scheme, activation) are read from config, card and tensor </text><text x="24.0" y="784.0" class="q" text-anchor="start">names only, not from code. </text></svg>