b" text-anchor="start">Gated short conv x 13</text><rect x="204.6" y="146" width="12" height="12" rx="2" class="k-full"/><text x="222.6" y="156.0" class="b" text-anchor="start">Global attention x 6</text><rect x="378.6" y="146" width="12" height="12" rx="2" class="k-swa"/><text x="396.6" y="156.0" class="b" text-anchor="start">Sliding-window attention x 5</text><text x="24.0" y="190.0" class="h" text-anchor="start">Decoder block</text><rect x="310.0" y="208.0" width="340.0" height="44.0" rx="8" class="box"/><text x="480.0" y="234.5" class="h" text-anchor="middle">Final norm + LM head (tied to embedding)</text><rect x="24" y="280" width="912" height="482" rx="10" class="cont"/><text x="40.0" y="302.0" class="h" text-anchor="start">repeated 24 times; residual connections around the mixer and the FFN</text><rect x="360.0" y="316.0" width="240.0" height="30.0" rx="8" class="box"/><text x="480.0" y="335.0" class="b" text-anchor="middle">Norm (post-FFN)</text><rect x="150.0" y="364.0" width="660.0" height="72.0" rx="8" class="box"/><text x="480.0" y="384.0" class="h" text-anchor="middle">Gated FFN: 2048 -&gt; 7680 -&gt; 2048</text><text x="480.0" y="402.0" class="q" text-anchor="middle">gate and up projections, then down projection</text><text x="480.0" y="418.0" class="q" text-anchor="middle">activation: silu</text><rect x="360.0" y="454.0" width="240.0" height="30.0" rx="8" class="box"/><text x="480.0" y="473.0" class="b" text-anchor="middle">Norm</text><rect x="360.0" y="502.0" width="240.0" height="30.0" rx="8" class="box"/><text x="480.0" y="521.0" class="b" text-anchor="middle">Norm (post-mixer)</text><rect x="40.0" y="576.0" width="282.7" height="114.0" rx="8" class="mix k-conv"/><text x="181.3" y="596.0" class="h" text-anchor="middle">Gated short conv (13 layers)</text><text x="181.3" y="614.0" class="q" text-anchor="middle">depthwise conv, kernel 7</text><text x="181.3" y="630.0" class="q" text-anchor="middle">gated: in_proj x3, out_proj</text><text x="181.3" y="646.0" class="q" text-anchor="middle">keeps last few inputs</text><text x="181.3" y="662.0" class="q" text-anchor="middle">cache does not grow</text><rect x="338.7" y="576.0" width="282.7" height="114.0" rx="8" class="mix k-full"/><text x="480.0" y="596.0" class="h" text-anchor="middle">Global attention (6 layers)</text><text x="480.0" y="614.0" class="q" text-anchor="middle">GQA 16 q / 4 kv, head 128</text><text x="480.0" y="630.0" class="q" text-anchor="middle">attends to every token</text><text x="480.0" y="646.0" class="q" text-anchor="middle">partial RoPE 0.5, theta 1,000,000</text><text x="480.0" y="662.0" class="q" text-anchor="middle">QK-norm + output gate</text><rect x="637.3" y="576.0" width="282.7" height="114.0" rx="8" class="mix k-swa"/><text x="778.7" y="596.0" class="h" text-anchor="middle">Sliding-window attention (5 layers)</text><text x="778.7" y="614.0" class="q" text-anchor="middle">GQA 16 q / 4 kv, head 128</text><text x="778.7" y="630.0" class="q" text-anchor="middle">window 256 tokens</text><text x="778.7" y="646.0" class="q" text-anchor="middle">RoPE theta 10,000</text><text x="778.7" y="662.0" class="q" text-anchor="middle">QK-norm + output gate</text><text x="40.0" y="570.0" class="q" text-anchor="start">one mixer per layer</text><rect x="360.0" y="708.0" width="240.0" height="30.0" rx="8" class="box"/><text x="480.0" y="727.0" class="b" text-anchor="middle">Norm (pre-mixer)</text><path d="M480.0 364V348" class="edge" marker-end="url(#ar)"/><path d="M480.0 454V438" class="edge" marker-end="url(#ar)"/><path d="M480.0 502V486" class="edge" marker-end="url(#ar)"/><path d="M181.3 576V554.0H480.0V534" class="edge" marker-end="url(#ar)"/><path d="M480.0 576V554.0H480.0V534" class="edge" marker-end="url(#ar)"/><path d="M778.7 576V554.0H480.0V534" class="edge" marker-end="url(#ar)"/><path d="M480.0 708V699.0H181.3V692" class="edge" marker-end="url(#ar)"/><path d="M480.0 708V699.0H480.0V692" class="edge" marker-end="url(#ar)"/><path d="M480.0 708V69