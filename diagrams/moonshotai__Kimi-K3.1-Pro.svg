ght="12" rx="2" class="k-dsa"/><text x="249.0" y="156.0" class="b" text-anchor="start">Gated DSA (sparse, on MLA) x 24</text><text x="477.6" y="156.0" class="q" text-anchor="start">(black bar: layer 1 has a dense FFN; layers 2-93 use MoE)</text><text x="24.0" y="190.0" class="h" text-anchor="start">Decoder block</text><rect x="310.0" y="208.0" width="340.0" height="44.0" rx="8" class="box"/><text x="480.0" y="234.5" class="h" text-anchor="middle">Final norm + LM head</text><rect x="24" y="280" width="912" height="402" rx="10" class="cont"/><text x="40.0" y="302.0" class="h" text-anchor="start">repeated 93 times; learned residual-weight tensors present; mechanism unverified</text><rect x="150.0" y="316.0" width="660.0" height="88.0" rx="8" class="box"/><text x="480.0" y="336.0" class="h" text-anchor="middle">MoE FFN: 896 experts, top-16 + 2 shared</text><text x="480.0" y="354.0" class="q" text-anchor="middle">routed experts run in a 3584-dim latent: 7168 -&gt; 3584 -&gt; 3072 -&gt; 3584 -&gt; 7168</text><text x="480.0" y="370.0" class="q" text-anchor="middle">sigmoid router · activation situ (card: SiTU-GLU)</text><text x="480.0" y="386.0" class="q" text-anchor="middle">dense prefix: FFN 7168 -&gt; 33792 -&gt; 7168</text><rect x="360.0" y="422.0" width="240.0" height="30.0" rx="8" class="box"/><text x="480.0" y="441.0" class="b" text-anchor="middle">Norm</text><rect x="172.0" y="496.0" width="300.0" height="114.0" rx="8" class="mix k-kda"/><text x="322.0" y="516.0" class="h" text-anchor="middle">KDA linear attention (69 layers)</text><text x="322.0" y="534.0" class="q" text-anchor="middle">96 heads x 128 dims</text><text x="322.0" y="550.0" class="q" text-anchor="middle">fixed 128x128 state per head</text><text x="322.0" y="566.0" class="q" text-anchor="middle">short conv k=4 on q, k, v</text><text x="322.0" y="582.0" class="q" text-anchor="middle">cache does not grow with context</text><rect x="488.0" y="496.0" width="300.0" height="114.0" rx="8" class="mix k-dsa"/><text x="638.0" y="516.0" class="h" text-anchor="middle">Gated DSA (sparse, on MLA) (24 layers)</text><text x="638.0" y="534.0" class="q" text-anchor="middle">MLA: caches 512 latent + 64 RoPE</text><text x="638.0" y="550.0" class="q" text-anchor="middle">indexer 32 heads x 128</text><text x="638.0" y="566.0" class="q" text-anchor="middle">each query reads top-2048 tokens</text><text x="638.0" y="582.0" class="q" text-anchor="middle">output gate</text><text x="172.0" y="490.0" class="q" text-anchor="start">one mixer per layer</text><rect x="360.0" y="628.0" width="240.0" height="30.0" rx="8" class="box"/><text x="480.0" y="647.0" class="b" text-anchor="middle">Norm (pre-mixer)</text><path d="M480.0 422V406" class="edge" marker-end="url(#ar)"/><path d="M322.0 496V474.0H480.0V454" class="edge" marker-end="url(#ar)"/><path d="M638.0 496V474.0H480.0V454" class="edge" marker-end="url(#ar)"/><path d="M480.0 628V619.0H322.0V612" class="edge" marker-end="url(#ar)"/><path d="M480.0 628V619.0H638.0V612" class="edge" marker-end="url(#ar)"/><path d="M480.0 280V254" class="edge" marker-end="url(#ar)"/><path d="M480.0 710V660" class="edge" marker-end="url(#ar)"/><rect x="310.0" y="710.0" width="340.0" height="44.0" rx="8" class="box"/><text x="480.0" y="736.5" class="h" text-anchor="middle">Token embedding 163,840 x 7168</text><path d="M480.0 786V756" class="edge" marker-end="url(#ar)"/><text x="488.0" y="774.0" class="q" text-anchor="start">image tokens join the token sequence</text><rect x="310.0" y="786.0" width="340.0" height="60.0" rx="8" class="box"/><text x="480.0" y="806.0" class="h" text-anchor="middle">Vision encoder + projector</text><text x="480.0" y="824.0" class="q" text-anchor="middle">27 layers, 401.21M + 46.14M params</text><text x="24.0" y="876.0" class="q" text-anchor="start">Note: No modeling_*.py in the repo: mechanism details (layer internals, residual scheme, activation) are read from config, card and tensor </text><text x="24.0" y="892.0" class="q" text-anchor="start">names only, not from code. </text></svg>