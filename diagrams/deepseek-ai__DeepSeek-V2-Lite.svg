xt x="817.8" y="134.0" class="q" text-anchor="middle">24</text><text x="851.6" y="134.0" class="q" text-anchor="middle">25</text><text x="885.3" y="134.0" class="q" text-anchor="middle">26</text><text x="919.1" y="134.0" class="q" text-anchor="middle">27</text><path d="M24.6 122H57.17777777777778" stroke="#1f2328" stroke-width="3"/><rect x="24" y="146" width="12" height="12" rx="2" class="k-mla"/><text x="42.0" y="156.0" class="b" text-anchor="start">MLA (full) x 27</text><text x="165.0" y="156.0" class="q" text-anchor="start">(black bar: layer 1 has a dense FFN; layers 2-27 use MoE)</text><text x="24.0" y="190.0" class="h" text-anchor="start">Decoder block</text><rect x="310.0" y="208.0" width="340.0" height="44.0" rx="8" class="box"/><text x="480.0" y="234.5" class="h" text-anchor="middle">Final norm + LM head</text><rect x="24" y="280" width="912" height="386" rx="10" class="cont"/><text x="40.0" y="302.0" class="h" text-anchor="start">repeated 27 times; residual connections around the mixer and the FFN</text><rect x="150.0" y="316.0" width="660.0" height="72.0" rx="8" class="box"/><text x="480.0" y="336.0" class="h" text-anchor="middle">MoE FFN: 64 experts, top-6 + 2 shared</text><text x="480.0" y="354.0" class="q" text-anchor="middle"> router · activation silu</text><text x="480.0" y="370.0" class="q" text-anchor="middle">dense prefix: FFN 2048 -&gt; 10944 -&gt; 2048</text><rect x="360.0" y="406.0" width="240.0" height="30.0" rx="8" class="box"/><text x="480.0" y="425.0" class="b" text-anchor="middle">Norm</text><rect x="330.0" y="480.0" width="300.0" height="114.0" rx="8" class="mix k-mla"/><text x="480.0" y="500.0" class="h" text-anchor="middle">MLA (full) (27 layers)</text><text x="480.0" y="518.0" class="q" text-anchor="middle">MLA: caches 512 latent + 64 RoPE</text><text x="480.0" y="534.0" class="q" text-anchor="middle">16 heads, q/k 192, v 128</text><text x="480.0" y="550.0" class="q" text-anchor="middle">attends to every token</text><text x="480.0" y="566.0" class="q" text-anchor="middle">gate status unverified</text><text x="330.0" y="474.0" class="q" text-anchor="start">one mixer per layer</text><rect x="360.0" y="612.0" width="240.0" height="30.0" rx="8" class="box"/><text x="480.0" y="631.0" class="b" text-anchor="middle">Norm (pre-mixer)</text><path d="M480.0 406V390" class="edge" marker-end="url(#ar)"/><path d="M480.0 480V438" class="edge" marker-end="url(#ar)"/><path d="M480.0 612V596" class="edge" marker-end="url(#ar)"/><path d="M480.0 280V254" class="edge" marker-end="url(#ar)"/><path d="M480.0 694V644" class="edge" marker-end="url(#ar)"/><rect x="310.0" y="694.0" width="340.0" height="44.0" rx="8" class="box"/><text x="480.0" y="720.5" class="h" text-anchor="middle">Token embedding 102,400 x 2048</text><text x="24.0" y="768.0" class="q" text-anchor="start">Note: Config keys not consumed by the extractor (including metadata/defaults): attention_bias, attention_dropout, auto_map.AutoConfig, </text><text x="24.0" y="784.0" class="q" text-anchor="start">auto_map.AutoModel, auto_map.AutoModelForCausalLM, aux_loss_alpha, bos_token_id, eos_token_id, initializer_range, moe_layer_freq, n_group, </text><text x="24.0" y="800.0" class="q" text-anchor="start">norm_topk_prob, pretraining_tp, rms_norm_eps, routed_scaling_factor, scoring_func, seq_aux, topk_group, topk_method, transformers_version, </text><text x="24.0" y="816.0" class="q" text-anchor="start">use_cache </text></svg>