">Decoder block</text><rect x="310.0" y="208.0" width="340.0" height="44.0" rx="8" class="box"/><text x="480.0" y="234.5" class="h" text-anchor="middle">Final norm + LM head</text><rect x="24" y="280" width="912" height="386" rx="10" class="cont"/><text x="40.0" y="302.0" class="h" text-anchor="start">repeated 36 times; residual connections around the mixer and the FFN</text><rect x="150.0" y="316.0" width="660.0" height="72.0" rx="8" class="box"/><text x="480.0" y="336.0" class="h" text-anchor="middle">Gated FFN: 2560 -&gt; 9728 -&gt; 2560</text><text x="480.0" y="354.0" class="q" text-anchor="middle">gate and up projections, then down projection</text><text x="480.0" y="370.0" class="q" text-anchor="middle">activation: silu</text><rect x="360.0" y="406.0" width="240.0" height="30.0" rx="8" class="box"/><text x="480.0" y="425.0" class="b" text-anchor="middle">Norm</text><rect x="330.0" y="480.0" width="300.0" height="114.0" rx="8" class="mix k-full"/><text x="480.0" y="500.0" class="h" text-anchor="middle">Global attention (36 layers)</text><text x="480.0" y="518.0" class="q" text-anchor="middle">GQA 32 q / 8 kv, head 128</text><text x="480.0" y="534.0" class="q" text-anchor="middle">attends to every token</text><text x="480.0" y="550.0" class="q" text-anchor="middle">RoPE</text><text x="480.0" y="566.0" class="q" text-anchor="middle">QK-norm</text><text x="330.0" y="474.0" class="q" text-anchor="start">one mixer per layer</text><rect x="360.0" y="612.0" width="240.0" height="30.0" rx="8" class="box"/><text x="480.0" y="631.0" class="b" text-anchor="middle">Norm (pre-mixer)</text><path d="M480.0 406V390" class="edge" marker-end="url(#ar)"/><path d="M480.0 480V438" class="edge" marker-end="url(#ar)"/><path d="M480.0 612V596" class="edge" marker-end="url(#ar)"/><path d="M480.0 280V254" class="edge" marker-end="url(#ar)"/><path d="M480.0 694V644" class="edge" marker-end="url(#ar)"/><rect x="310.0" y="694.0" width="340.0" height="44.0" rx="8" class="box"/><text x="480.0" y="720.5" class="h" text-anchor="middle">Token embedding 151,936 x 2560</text><path d="M480.0 770V740" class="edge" marker-end="url(#ar)"/><text x="488.0" y="758.0" class="q" text-anchor="start">image tokens join the token sequence</text><rect x="310.0" y="770.0" width="340.0" height="60.0" rx="8" class="box"/><text x="480.0" y="790.0" class="h" text-anchor="middle">Vision encoder + projector</text><text x="480.0" y="808.0" class="q" text-anchor="middle">24 layers, 330.37M + 0 params</text><text x="24.0" y="860.0" class="q" text-anchor="start">Note: Config keys not consumed by the extractor (including metadata/defaults): auto_map.AutoConfig, auto_map.AutoModel, </text><text x="24.0" y="876.0" class="q" text-anchor="start">auto_map.AutoModelForCausalLM, auto_map.AutoModelForImageTextToText, auto_map.AutoProcessor, auto_map.AutoVideoProcessor, bos_token_id, </text><text x="24.0" y="892.0" class="q" text-anchor="start">eos_token_id, image_token_id, text_config._name_or_path, text_config.architectures, text_config.attention_bias, </text><text x="24.0" y="908.0" class="q" text-anchor="start">text_config.attention_dropout, text_config.bos_token_id, text_config.dtype, text_config.eos_token_id, text_config.initializer_range, </text><text x="24.0" y="924.0" class="q" text-anchor="start">text_config.max_window_layers, text_config.rms_norm_eps, text_config.rope_scaling, text_config.tie_word_embeddings, text_config.use_cache, </text><text x="24.0" y="940.0" class="q" text-anchor="start">text_config.use_sliding_window, transformers_version, video_token_id, vision_config.attention_dropout, vision_config.frame_windows_size, </text><text x="24.0" y="956.0" class="q" text-anchor="start">vision_config.hidden_act, vision_config.image_size, vision_config.initializer_range, vision_config.intermediate_size, </text><text x="24.0" y="972.0" class="q" text-anchor="start">vision_config.layer_norm_eps, vision_config.layer_norm_type, vision_config.max_position_embeddings, vision_config.model_type, </text><text x="24.0" y="988.0" class="q" text-anchor="start">vision_config.num_attention_heads, vision_config.num_channels, vision_config.out_hidden_size, vision_config.patch_size, </text><text x="24.0" y="1004.0" class="q" text-anchor="start">vision_config.rope_theta, vision_config.spatial_merge_size, vision_config.temporal_patch_size, vision_config.text_hidden_size, </text><text x="24.0" y="1020.0" class="q" text-anchor="start">vision_config.tokens_per_second, vision_config.use_head, vision_end_token_id, vision_start_token_id </text></svg>